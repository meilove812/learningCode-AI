<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分组题解题技巧</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#faf6f1;color:#2d2d2d;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;justify-content:center;height:100vh;overflow:hidden}
.s{width:100vw;max-width:430px;height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#faf6f1,#f5efe8)}
.deco{position:absolute;border-radius:50%;opacity:.05}
.dc1{width:280px;height:280px;background:#ff9a76;top:-80px;right:-80px}
.dc2{width:200px;height:200px;background:#a8d8ea;bottom:80px;left:-60px}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px 140px;opacity:0;pointer-events:none;z-index:2;transition:opacity .7s}
.pg.on{opacity:1;pointer-events:auto}
.pg.on .fi{opacity:1;transform:translateY(0)}
.fi{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.fi.d1{transition-delay:.15s}.fi.d2{transition-delay:.3s}.fi.d3{transition-delay:.45s}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}70%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeScale{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px;background:#fff8ee;color:#e67e22;border:1px solid #f5d0a0}
.badge.step{background:#eef6ff;color:#3498db;border:1px solid #a8d8ea}
.badge.ok{background:#f0fff4;color:#27ae60;border:1px solid #a3d9b1}
.badge.find{background:#fef3ff;color:#9b59b6;border:1px solid #d5b8e8}
.t-lg{font-size:30px;font-weight:900;text-align:center;line-height:1.4}
.t-lg .warm{color:#e67e22}
.t-md{font-size:18px;font-weight:600;text-align:center;line-height:1.7;color:#444}
.t-sm{font-size:13px;color:#aaa;text-align:center;margin-top:6px}
.items-area{width:330px;min-height:160px;position:relative;margin:14px 0;padding:16px;border-radius:20px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
/* person circles */
.person{display:flex;flex-direction:column;align-items:center;gap:3px;animation:bounceIn .5s backwards}
.person .head{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.person.adult .head{width:48px;height:48px;font-size:12px}
.person.child .head{width:36px;height:36px;font-size:10px}
.person .plbl{font-size:9px;color:#888;font-weight:600}
/* colors */
.person.adult .head{background:linear-gradient(135deg,#6c5ce7,#4834d4)}
.person.child .head{background:linear-gradient(135deg,#a29bfe,#786fa6)}
.person.male .head{background:linear-gradient(135deg,#3498db,#2980b9)}
.person.female .head{background:linear-gradient(135deg,#e84393,#d63384)}
.groups{width:330px;display:flex;gap:8px;margin:10px 0}
.group{flex:1;padding:10px 6px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.03);text-align:center;animation:slideUp .5s backwards}
.group .g-title{font-size:12px;color:#888;margin-bottom:6px;font-weight:600}
.group .g-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:40px}
.group .g-count{font-size:22px;font-weight:900;margin-top:6px;color:#27ae60}
.calc{width:330px;padding:14px 20px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 3px 12px rgba(0,0,0,.04);margin:10px 0;text-align:center;animation:bounceIn .6s .3s backwards}
.calc .eq{font-size:20px;font-weight:900;line-height:1.8;color:#27ae60}
.tip-box{width:330px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,#fff8ee,#fff3e0);border:2px solid #f5d0a0;margin:10px 0}
.tip-box .tip{font-size:18px;font-weight:900;color:#e67e22;line-height:1.7}
.nw{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:14px 24px 20px;background:linear-gradient(transparent,rgba(250,246,241,.97) 30%)}
.nar{text-align:center;font-size:16px;line-height:1.8;color:#444;font-weight:500;min-height:36px}
.bt{height:3px;border-radius:2px;background:rgba(0,0,0,.05);margin-top:8px}
.bf{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9a76,#e67e22);transition:width .5s}
.tag{position:absolute;top:16px;left:20px;font-size:10px;color:#ccc;letter-spacing:2px;font-weight:600;z-index:10}
.go{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;width:56px;height:56px;border:none;border-radius:50%;font-size:24px;background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(230,126,34,.2);display:flex;align-items:center;justify-content:center;padding:0}
.go.hide{display:none}
</style></head><body>
<div class="s">
<div class="deco dc1"></div><div class="deco dc2"></div>
<div class="tag">数学思维 · 分类与整理 · 二年级上第一单元</div>

<!-- p0: cover -->
<div class="pg on" id="p0">
  <div class="badge fi">分组题解题技巧</div>
  <div class="items-area fi d1" id="a0"></div>
  <div class="t-md fi d2" style="font-size:15px;color:#888">操场上来了一群人，怎么分组？</div>
</div>

<!-- p1: count total -->
<div class="pg" id="p1">
  <div class="badge step fi">第一步</div>
  <div class="t-lg fi d1"><span class="warm">先数总数</span></div>
  <div class="items-area fi d2" id="a1"></div>
  <div class="calc fi d3" id="c1"></div>
</div>

<!-- p2: by age -->
<div class="pg" id="p2">
  <div class="badge step fi">第二步 · 按年龄分</div>
  <div class="t-md fi d1">大人一组，小孩一组</div>
  <div class="groups fi d2" id="g1"></div>
  <div class="calc fi d3" id="c2"></div>
</div>

<!-- p3: verify age -->
<div class="pg" id="p3">
  <div class="badge ok fi">验证</div>
  <div class="t-md fi d1">加一加，<span style="color:#27ae60;font-weight:700">对总数</span></div>
  <div class="calc fi d2" id="c3"></div>
  <div class="t-md fi d3" style="font-size:15px;color:#27ae60">对上了，说明分对了</div>
</div>

<!-- p4: by gender -->
<div class="pg" id="p4">
  <div class="badge step fi">第三步 · 换一种分法</div>
  <div class="t-md fi d1">按<span style="color:#3498db;font-weight:700">男女</span>来分</div>
  <div class="groups fi d2" id="g2"></div>
  <div class="calc fi d3" id="c4"></div>
</div>

<!-- p5: discovery -->
<div class="pg" id="p5">
  <div class="badge find fi">发现</div>
  <div class="t-lg fi d1" style="font-size:24px"><span class="warm">不管怎么分，总数不变</span></div>
  <div class="calc fi d2" id="c5"></div>
  <div class="t-md fi d3" style="font-size:15px;color:#9b59b6">分法不同，每组人数不同，总数都是14</div>
</div>

<!-- p6: summary -->
<div class="pg" id="p6">
  <div class="tip-box fi">
    <div class="tip">分完加一加对总数<br>对上了就分对了<br>换种分法再验证一次更稳</div>
  </div>
  <div class="t-md fi d1" style="margin-top:16px;font-size:15px;color:#888">掌握验证思路<br>分组题就不怕出错</div>
</div>

<div class="nw"><div class="nar" id="nar"></div><div class="bt"><div class="bf" id="bar" style="width:0"></div></div></div>
<button class="go" id="go" onclick="doStart()">▶</button>
</div>

<script>
// 14 people: 8 adults (5M+3F), 6 children (2M+4F)
// by age: 8 adults + 6 children = 14
// by gender: 7 male + 7 female = 14
// adults: 5 male + 3 female = 8; children: 2 male + 4 female = 6
// male total = 5+2 = 7; female total = 3+4 = 7
var PEOPLE=[
  {type:'adult',gender:'m'},{type:'adult',gender:'m'},{type:'adult',gender:'m'},{type:'adult',gender:'m'},{type:'adult',gender:'m'},
  {type:'adult',gender:'f'},{type:'adult',gender:'f'},{type:'adult',gender:'f'},
  {type:'child',gender:'m'},{type:'child',gender:'m'},
  {type:'child',gender:'f'},{type:'child',gender:'f'},{type:'child',gender:'f'},{type:'child',gender:'f'}
];

function mkPerson(p,delay){
  var d=document.createElement('div');
  d.className='person '+(p.type==='adult'?'adult':'child');
  d.style.animationDelay=(delay*0.06)+'s';
  var h=document.createElement('div');h.className='head';
  h.textContent=p.type==='adult'?'大':'小';
  d.appendChild(h);
  var lb=document.createElement('div');lb.className='plbl';
  lb.textContent=p.type==='adult'?'大人':'小孩';
  d.appendChild(lb);
  return d;
}

function mkGenderPerson(p,delay){
  var d=document.createElement('div');
  d.className='person '+(p.gender==='m'?'male':'female');
  d.style.animationDelay=(delay*0.06)+'s';
  var h=document.createElement('div');h.className='head';
  h.style.width=p.type==='adult'?'48px':'36px';
  h.style.height=p.type==='adult'?'48px':'36px';
  h.style.fontSize=p.type==='adult'?'12px':'10px';
  h.textContent=p.gender==='m'?'男':'女';
  d.appendChild(h);
  var lb=document.createElement('div');lb.className='plbl';
  lb.textContent=(p.gender==='m'?'男':'女');
  d.appendChild(lb);
  return d;
}

function showAll(id){
  var el=document.getElementById(id);el.innerHTML='';
  for(var i=0;i<PEOPLE.length;i++) el.appendChild(mkPerson(PEOPLE[i],i));
}

function showCount(id){
  document.getElementById(id).innerHTML='<div class="eq">数一数：一共 <span style="font-size:28px">14</span> 个人</div>';
}

function showAgeGroups(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var adults=PEOPLE.filter(function(p){return p.type==='adult'});
  var children=PEOPLE.filter(function(p){return p.type==='child'});

  var ga=document.createElement('div');ga.className='group';ga.style.animationDelay='0s';
  var html='<div class="g-title">大人</div><div class="g-items">';
  for(var i=0;i<adults.length;i++){
    html+='<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#4834d4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);animation:fadeScale .3s '+(i*0.08)+'s backwards">大</div>';
  }
  html+='</div><div class="g-count">8</div>';ga.innerHTML=html;el.appendChild(ga);

  var gc=document.createElement('div');gc.className='group';gc.style.animationDelay='.2s';
  html='<div class="g-title">小孩</div><div class="g-items">';
  for(var i=0;i<children.length;i++){
    html+='<div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a29bfe,#786fa6);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);animation:fadeScale .3s '+(i*0.08+0.2)+'s backwards">小</div>';
  }
  html+='</div><div class="g-count">6</div>';gc.innerHTML=html;el.appendChild(gc);

  document.getElementById(cid).innerHTML='<div class="eq">8 + 6 = 14 ✅</div>';
}

function showVerify(cid){
  document.getElementById(cid).innerHTML='<div class="eq">大人 8 + 小孩 6 = 14<br>和总数一样 ✅</div>';
}

function showGenderGroups(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var males=PEOPLE.filter(function(p){return p.gender==='m'});
  var females=PEOPLE.filter(function(p){return p.gender==='f'});

  var gm=document.createElement('div');gm.className='group';gm.style.animationDelay='0s';
  var html='<div class="g-title">男生</div><div class="g-items">';
  for(var i=0;i<males.length;i++){
    var sz=males[i].type==='adult'?34:28;
    html+='<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:linear-gradient(135deg,#3498db,#2980b9);display:flex;align-items:center;justify-content:center;font-size:'+(sz<30?'8':'9')+'px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);animation:fadeScale .3s '+(i*0.08)+'s backwards">男</div>';
  }
  html+='</div><div class="g-count">7</div>';gm.innerHTML=html;el.appendChild(gm);

  var gf=document.createElement('div');gf.className='group';gf.style.animationDelay='.2s';
  html='<div class="g-title">女生</div><div class="g-items">';
  for(var i=0;i<females.length;i++){
    var sz=females[i].type==='adult'?34:28;
    html+='<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:linear-gradient(135deg,#e84393,#d63384);display:flex;align-items:center;justify-content:center;font-size:'+(sz<30?'8':'9')+'px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);animation:fadeScale .3s '+(i*0.08+0.2)+'s backwards">女</div>';
  }
  html+='</div><div class="g-count">7</div>';gf.innerHTML=html;el.appendChild(gf);

  document.getElementById(cid).innerHTML='<div class="eq">7 + 7 = 14 ✅</div>';
}

function showDiscovery(cid){
  document.getElementById(cid).innerHTML='<div class="eq">按年龄：8 + 6 = 14<br>按男女：7 + 7 = 14<br>总数都是 14 ✅</div>';
}

showAll('a0');

var voice=null,playing=false,si=0;
function pickVoice(){var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/Xiaoxiao.*Online.*Natural/i.test(vs[i].name)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/Online.*Natural/i.test(vs[i].name)&&/zh/i.test(vs[i].lang)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/zh/i.test(vs[i].lang)){voice=vs[i];break}}}
if(typeof speechSynthesis!=='undefined'){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(text,cb){var done=false;function finish(){if(!done){done=true;clearTimeout(tmr);setTimeout(cb,600)}}
  var tmr=setTimeout(finish,Math.max(text.length*400,3000));
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='zh-CN';u.rate=0.9;u.pitch=1.05;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch(e){finish()}}
function showPage(id){var ps=document.querySelectorAll('.pg');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');document.getElementById(id).classList.add('on')}

var STEPS=[
  {p:'p0',t:'分组题，操场上来了一群人。',fn:function(){showAll('a0')}},
  {p:'p1',t:'第一步，先数总数。',fn:function(){showAll('a1');showCount('c1')}},
  {p:'p1',t:'大人和小孩加在一起，一共14个人。'},
  {p:'p2',t:'第二步，按年龄分成两组。',fn:function(){showAgeGroups('g1','c2')}},
  {p:'p2',t:'大人8个，小孩6个。'},
  {p:'p3',t:'加一加对总数，8加6等于14。',fn:function(){showVerify('c3')}},
  {p:'p3',t:'和总数一样，说明分对了。'},
  {p:'p4',t:'第三步，换一种，按男女分。',fn:function(){showGenderGroups('g2','c4')}},
  {p:'p4',t:'男生7个，女生7个，7加7也是14。'},
  {p:'p5',t:'发现了吗？不管怎么分，总数不变。',fn:function(){showDiscovery('c5')}},
  {p:'p5',t:'分法不同，每组人数不同，总数都是14。'},
  {p:'p6',t:'分完加一加对总数，对上了就分对了。'},
  {p:'p6',t:'换种分法再验证，更稳妥。'}
];
function runStep(){if(si>=STEPS.length){si=0;playing=false;document.getElementById('go').classList.remove('hide');document.getElementById('go').textContent='↻';return}
  var s=STEPS[si];showPage(s.p);if(s.fn)try{s.fn()}catch(e){}
  document.getElementById('nar').innerHTML=s.t;document.getElementById('bar').style.width=Math.round(((si+1)/STEPS.length)*100)+'%';
  speak(s.t,function(){si++;runStep()})}
function doStart(){if(playing)return;playing=true;si=0;document.getElementById('go').classList.add('hide');runStep()}
</script>
</body></html>
