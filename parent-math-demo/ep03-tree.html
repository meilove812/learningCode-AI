<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多次分类解题技巧</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#faf6f1;color:#2d2d2d;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;justify-content:center;height:100vh;overflow:hidden}
.s{width:100vw;max-width:430px;height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#faf6f1,#f5efe8)}
.deco{position:absolute;border-radius:50%;opacity:.05}
.dc1{width:280px;height:280px;background:#ff9a76;top:-80px;right:-80px}
.dc2{width:200px;height:200px;background:#a8d8ea;bottom:80px;left:-60px}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px 140px;opacity:0;pointer-events:none;z-index:2;transition:opacity .7s}
.pg.on{opacity:1;pointer-events:auto}
.pg.on .fi{opacity:1;transform:translateY(0)}
.fi{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.fi.d1{transition-delay:.15s}.fi.d2{transition-delay:.3s}.fi.d3{transition-delay:.45s}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}70%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px;background:#fff8ee;color:#e67e22;border:1px solid #f5d0a0}
.badge.step{background:#eef6ff;color:#3498db;border:1px solid #a8d8ea}
.badge.ok{background:#f0fff4;color:#27ae60;border:1px solid #a3d9b1}
.t-lg{font-size:28px;font-weight:900;text-align:center;line-height:1.4}
.t-lg .warm{color:#e67e22}
.t-md{font-size:18px;font-weight:600;text-align:center;line-height:1.7;color:#444}
.t-sm{font-size:13px;color:#aaa;text-align:center;margin-top:6px}
.btn-area{width:330px;min-height:160px;padding:16px;border-radius:20px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:12px 0}
.btn-item{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.1);animation:bounceIn .4s backwards}
.btn-item.circle{border-radius:50%}
.btn-item.red{background:linear-gradient(135deg,#ff6b6b,#ee5a5a)}
.btn-item.blue{background:linear-gradient(135deg,#74b9ff,#5a9bdb)}
.btn-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);position:absolute}
.groups{width:330px;display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.group{padding:8px 6px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.03);text-align:center;animation:slideUp .5s backwards;min-width:70px}
.group .g-title{font-size:11px;color:#888;margin-bottom:4px;font-weight:600}
.group .g-items{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:32px}
.group .g-count{font-size:16px;font-weight:900;margin-top:4px;color:#27ae60}
.tree{width:330px;padding:14px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 3px 12px rgba(0,0,0,.04);margin:10px 0;font-size:13px;line-height:2}
.tree .lv0{font-weight:800;color:#e67e22}
.tree .lv1{margin-left:16px;color:#3498db;font-weight:700}
.tree .lv2{margin-left:32px;color:#27ae60}
.tree .lv3{margin-left:48px;color:#888;font-size:12px}
.calc{width:330px;padding:14px 20px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 3px 12px rgba(0,0,0,.04);margin:10px 0;text-align:center;animation:bounceIn .6s .3s backwards}
.calc .eq{font-size:20px;font-weight:900;line-height:1.8;color:#27ae60}
.tip-box{width:330px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,#fff8ee,#fff3e0);border:2px solid #f5d0a0;margin:10px 0}
.tip-box .tip{font-size:17px;font-weight:900;color:#e67e22;line-height:1.7}
.nw{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:14px 24px 20px;background:linear-gradient(transparent,rgba(250,246,241,.97) 30%)}
.nar{text-align:center;font-size:16px;line-height:1.8;color:#444;font-weight:500;min-height:36px}
.bt{height:3px;border-radius:2px;background:rgba(0,0,0,.05);margin-top:8px}
.bf{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9a76,#e67e22);transition:width .5s}
.tag{position:absolute;top:16px;left:20px;font-size:10px;color:#ccc;letter-spacing:2px;font-weight:600;z-index:10}
.go{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;width:56px;height:56px;border:none;border-radius:50%;font-size:24px;background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(230,126,34,.2);display:flex;align-items:center;justify-content:center;padding:0}
.go.hide{display:none}
</style></head><body>
<div class="s">
<div class="deco dc1"></div><div class="deco dc2"></div>
<div class="tag">数学思维 · 分类与整理 · 二年级上第一单元</div>

<div class="pg on" id="p0">
  <div class="badge fi">多次分类解题技巧</div>
  <div class="btn-area fi d1" id="a0"></div>
  <div class="t-md fi d2" style="font-size:15px;color:#888">8个纽扣，怎么分清楚？</div>
</div>
<div class="pg" id="p1">
  <div class="badge step fi">第一次 · 按形状分</div>
  <div class="groups fi d1" id="g1"></div>
  <div class="calc fi d2" id="c1"></div>
</div>
<div class="pg" id="p2">
  <div class="badge step fi">第二次 · 每组再按颜色分</div>
  <div class="groups fi d1" id="g2"></div>
  <div class="calc fi d2" id="c2"></div>
</div>
<div class="pg" id="p3">
  <div class="badge step fi">第三次 · 再按扣眼分</div>
  <div class="groups fi d1" id="g3"></div>
  <div class="calc fi d2" id="c3"></div>
</div>
<div class="pg" id="p4">
  <div class="badge ok fi">分类树</div>
  <div class="tree fi d1" id="tree"></div>
</div>
<div class="pg" id="p5">
  <div class="tip-box fi">
    <div class="tip">分完一次还能继续分<br>每多分一次，类别翻一倍<br>2类 → 4类 → 8类</div>
  </div>
  <div class="t-md fi d1" style="margin-top:16px;font-size:15px;color:#888">掌握分类树<br>多次分类题都能理清</div>
</div>

<div class="nw"><div class="nar" id="nar"></div><div class="bt"><div class="bf" id="bar" style="width:0"></div></div></div>
<button class="go" id="go" onclick="doStart()">▶</button>
</div>
<script>
// 8个纽扣: 圆红2孔 圆红4孔 圆蓝2孔 圆蓝4孔 方红2孔 方红4孔 方蓝2孔 方蓝4孔
// 按形状: 圆4+方4=8 ✓
// 再按颜色: 圆红2+圆蓝2+方红2+方蓝2=8 ✓ (4类)
// 再按扣眼: 每类各1个=8类 ✓
var BTNS=[
  {shape:'circle',color:'red',holes:2},{shape:'circle',color:'red',holes:4},
  {shape:'circle',color:'blue',holes:2},{shape:'circle',color:'blue',holes:4},
  {shape:'square',color:'red',holes:2},{shape:'square',color:'red',holes:4},
  {shape:'square',color:'blue',holes:2},{shape:'square',color:'blue',holes:4}
];
function makeBtn(b,size){
  size=size||44;var d=document.createElement('div');
  d.className='btn-item '+(b.shape==='circle'?'circle':'')+' '+b.color;
  d.style.width=size+'px';d.style.height=size+'px';
  var positions=b.holes===2?[['40%','30%'],['40%','60%']]:[['30%','30%'],['30%','60%'],['60%','30%'],['60%','60%']];
  for(var i=0;i<positions.length;i++){
    var dot=document.createElement('div');dot.className='btn-dot';
    dot.style.top=positions[i][0];dot.style.left=positions[i][1];d.appendChild(dot);}
  return d;
}
function showButtons(id){
  var el=document.getElementById(id);el.innerHTML='';
  for(var i=0;i<BTNS.length;i++){var d=makeBtn(BTNS[i]);d.style.animationDelay=(i*0.08)+'s';el.appendChild(d);}
}
function showShape(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var gs=[{name:'圆形',filter:function(b){return b.shape==='circle'}},
          {name:'方形',filter:function(b){return b.shape==='square'}}];
  for(var i=0;i<gs.length;i++){
    var g=document.createElement('div');g.className='group';g.style.animationDelay=(i*0.2)+'s';g.style.minWidth='140px';
    var items=BTNS.filter(gs[i].filter);
    var html='<div class="g-title">'+gs[i].name+'</div><div class="g-items">';
    for(var j=0;j<items.length;j++){var bd=makeBtn(items[j],34);bd.style.animationDelay=(i*0.2+j*0.08)+'s';
      html+='<div class="btn-placeholder" data-idx="'+i+'-'+j+'"></div>';}
    html+='</div><div class="g-count">'+items.length+'</div>';g.innerHTML=html;el.appendChild(g);
    var phs=g.querySelectorAll('.btn-placeholder');
    for(var j=0;j<items.length;j++){phs[j].replaceWith(makeBtn(items[j],34));}
  }
  document.getElementById(cid).innerHTML='<div class="eq">4 + 4 = 8 ✅（2类）</div>';
}
function showColor(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var gs=[{name:'圆红',f:function(b){return b.shape==='circle'&&b.color==='red'}},
          {name:'圆蓝',f:function(b){return b.shape==='circle'&&b.color==='blue'}},
          {name:'方红',f:function(b){return b.shape==='square'&&b.color==='red'}},
          {name:'方蓝',f:function(b){return b.shape==='square'&&b.color==='blue'}}];
  for(var i=0;i<gs.length;i++){
    var g=document.createElement('div');g.className='group';g.style.animationDelay=(i*0.15)+'s';
    var items=BTNS.filter(gs[i].f);
    var html='<div class="g-title">'+gs[i].name+'</div><div class="g-items">';
    html+='</div><div class="g-count">'+items.length+'</div>';g.innerHTML=html;
    var gi=g.querySelector('.g-items');
    for(var j=0;j<items.length;j++)gi.appendChild(makeBtn(items[j],30));
    el.appendChild(g);}
  document.getElementById(cid).innerHTML='<div class="eq">2+2+2+2 = 8 ✅（4类）</div>';
}
function showHoles(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var names=['圆红2孔','圆红4孔','圆蓝2孔','圆蓝4孔','方红2孔','方红4孔','方蓝2孔','方蓝4孔'];
  for(var i=0;i<BTNS.length;i++){
    var g=document.createElement('div');g.className='group';g.style.animationDelay=(i*0.1)+'s';g.style.minWidth='60px';
    var html='<div class="g-title" style="font-size:10px">'+names[i]+'</div><div class="g-items">';
    html+='</div><div class="g-count">1</div>';g.innerHTML=html;
    g.querySelector('.g-items').appendChild(makeBtn(BTNS[i],28));
    el.appendChild(g);}
  document.getElementById(cid).innerHTML='<div class="eq">每类1个，共8类 ✅</div>';
}
function showTree(){
  document.getElementById('tree').innerHTML='<div class="lv0">全部纽扣（8个）</div><div class="lv1">⭕ 圆形（4）</div><div class="lv2">🔴 圆红（2）</div><div class="lv3">· 2孔（1）· 4孔（1）</div><div class="lv2">🔵 圆蓝（2）</div><div class="lv3">· 2孔（1）· 4孔（1）</div><div class="lv1">🟧 方形（4）</div><div class="lv2">🔴 方红（2）</div><div class="lv3">· 2孔（1）· 4孔（1）</div><div class="lv2">🔵 方蓝（2）</div><div class="lv3">· 2孔（1）· 4孔（1）</div>';
}
showButtons('a0');
var voice=null,playing=false,si=0;
function pickVoice(){var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/Xiaoxiao.*Online.*Natural/i.test(vs[i].name)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/Online.*Natural/i.test(vs[i].name)&&/zh/i.test(vs[i].lang)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/zh/i.test(vs[i].lang)){voice=vs[i];break}}}
if(typeof speechSynthesis!=='undefined'){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(text,cb){var done=false;function finish(){if(!done){done=true;clearTimeout(tmr);setTimeout(cb,600)}}
  var tmr=setTimeout(finish,Math.max(text.length*400,3000));
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='zh-CN';u.rate=0.9;u.pitch=1.05;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch(e){finish()}}
function showPage(id){var ps=document.querySelectorAll('.pg');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');document.getElementById(id).classList.add('on')}
var STEPS=[
  {p:'p0',t:'八个纽扣，形状颜色扣眼都不同。',fn:function(){showButtons('a0')}},
  {p:'p0',t:'怎么分清楚？'},
  {p:'p1',t:'第一次，按形状分。',fn:function(){showShape('g1','c1')}},
  {p:'p1',t:'圆的四个，方的四个，分成两类。'},
  {p:'p2',t:'每组再按颜色分。',fn:function(){showColor('g2','c2')}},
  {p:'p2',t:'两类变成了四类。'},
  {p:'p3',t:'再按扣眼分。',fn:function(){showHoles('g3','c3')}},
  {p:'p3',t:'四类变成了八类，每类一个。'},
  {p:'p4',t:'画成分类树，层次一目了然。',fn:showTree},
  {p:'p4',t:'每多分一次，类别翻一倍。'},
  {p:'p5',t:'分完一次还能继续分。'},
  {p:'p5',t:'掌握分类树，多次分类题都能理清。'}
];
function runStep(){if(si>=STEPS.length){si=0;playing=false;document.getElementById('go').classList.remove('hide');document.getElementById('go').textContent='↻';return}
  var s=STEPS[si];showPage(s.p);if(s.fn)try{s.fn()}catch(e){}
  document.getElementById('nar').innerHTML=s.t;document.getElementById('bar').style.width=Math.round(((si+1)/STEPS.length)*100)+'%';
  speak(s.t,function(){si++;runStep()})}
function doStart(){if(playing)return;playing=true;si=0;document.getElementById('go').classList.add('hide');runStep()}
</script></body></html>
