<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多次分类解题技巧</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#faf6f1;color:#2d2d2d;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;justify-content:center;height:100vh;overflow:hidden}
.s{width:100vw;max-width:430px;height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#faf6f1,#f5efe8)}
.deco{position:absolute;border-radius:50%;opacity:.05}
.dc1{width:280px;height:280px;background:#ff9a76;top:-80px;right:-80px}
.dc2{width:200px;height:200px;background:#a8d8ea;bottom:80px;left:-60px}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px 140px;opacity:0;pointer-events:none;z-index:2;transition:opacity .7s}
.pg.on{opacity:1;pointer-events:auto}
.pg.on .fi{opacity:1;transform:translateY(0)}
.fi{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.fi.d1{transition-delay:.15s}.fi.d2{transition-delay:.3s}.fi.d3{transition-delay:.45s}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}70%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeScale{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes treeGrow{from{opacity:0;max-height:0}to{opacity:1;max-height:400px}}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px;background:#fff8ee;color:#e67e22;border:1px solid #f5d0a0}
.badge.step{background:#eef6ff;color:#3498db;border:1px solid #a8d8ea}
.badge.ok{background:#f0fff4;color:#27ae60;border:1px solid #a3d9b1}
.badge.find{background:#fef3ff;color:#9b59b6;border:1px solid #d5b8e8}
.t-lg{font-size:28px;font-weight:900;text-align:center;line-height:1.4}
.t-lg .warm{color:#e67e22}
.t-md{font-size:17px;font-weight:600;text-align:center;line-height:1.7;color:#444}
.t-sm{font-size:13px;color:#aaa;text-align:center;margin-top:6px}
.items-area{width:330px;min-height:120px;position:relative;margin:14px 0;padding:16px;border-radius:20px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
/* CSS buttons */
.btn{display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.12);animation:bounceIn .5s backwards;position:relative}
.btn.circle{border-radius:50%}
.btn.square{border-radius:8px}
.btn.red{background:linear-gradient(135deg,#ff6b6b,#ee5a5a)}
.btn.blue{background:linear-gradient(135deg,#5b9bd5,#4a8abf)}
.holes{display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center}
.hole{border-radius:50%;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.12)}
.btn.h2 .holes{flex-direction:row;gap:5px}
.btn.h4 .holes{width:60%;display:grid;grid-template-columns:1fr 1fr;gap:3px}
/* sizes */
.btn-lg{width:56px;height:56px}.btn-lg .hole{width:8px;height:8px}
.btn-md{width:42px;height:42px}.btn-md .hole{width:6px;height:6px}
.btn-sm{width:34px;height:34px}.btn-sm .hole{width:5px;height:5px}
/* groups */
.groups{width:330px;display:flex;gap:8px;margin:10px 0}
.group{flex:1;padding:10px 6px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.03);text-align:center;animation:slideUp .5s backwards}
.group .g-title{font-size:11px;color:#888;margin-bottom:6px;font-weight:600}
.group .g-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:36px}
.group .g-count{font-size:20px;font-weight:900;margin-top:5px;color:#27ae60}
/* tree */
.tree-box{width:330px;padding:14px 10px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 3px 12px rgba(0,0,0,.04);margin:10px 0;overflow:hidden}
.tree-box .tree-title{font-size:11px;color:#bbb;text-align:center;margin-bottom:8px;font-weight:600}
.tnode{display:inline-block;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;animation:fadeScale .4s backwards}
.tnode.root{background:linear-gradient(135deg,#e67e22,#d35400);font-size:12px;padding:4px 14px}
.tnode.l1{background:linear-gradient(135deg,#667eea,#764ba2)}
.tnode.leaf{background:linear-gradient(135deg,#27ae60,#1e8449);font-size:10px;padding:2px 8px}
.tconn{width:1px;height:12px;background:#ccc;margin:2px auto}
.tlevel{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}
.tbranch{display:flex;flex-direction:column;align-items:center}
.calc{width:330px;padding:14px 20px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 3px 12px rgba(0,0,0,.04);margin:10px 0;text-align:center;animation:bounceIn .6s .3s backwards}
.calc .eq{font-size:20px;font-weight:900;line-height:1.8;color:#27ae60}
.tip-box{width:330px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,#fff8ee,#fff3e0);border:2px solid #f5d0a0;margin:10px 0}
.tip-box .tip{font-size:17px;font-weight:900;color:#e67e22;line-height:1.7}
.nw{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:14px 24px 20px;background:linear-gradient(transparent,rgba(250,246,241,.97) 30%)}
.nar{text-align:center;font-size:16px;line-height:1.8;color:#444;font-weight:500;min-height:36px}
.bt{height:3px;border-radius:2px;background:rgba(0,0,0,.05);margin-top:8px}
.bf{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9a76,#e67e22);transition:width .5s}
.tag{position:absolute;top:16px;left:20px;font-size:10px;color:#ccc;letter-spacing:2px;font-weight:600;z-index:10}
.go{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;width:56px;height:56px;border:none;border-radius:50%;font-size:24px;background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(230,126,34,.2);display:flex;align-items:center;justify-content:center;padding:0}
.go.hide{display:none}
</style></head><body>
<div class="s">
<div class="deco dc1"></div><div class="deco dc2"></div>
<div class="tag">数学思维 · 分类与整理 · 二年级上第一单元</div>

<div class="pg on" id="p0">
  <div class="badge fi">多次分类解题技巧</div>
  <div class="items-area fi d1" id="a0"></div>
  <div class="t-md fi d2" style="font-size:15px;color:#888">8个纽扣撒了一地，怎么整理？</div>
</div>

<div class="pg" id="p1">
  <div class="badge step fi">第一步 · 按形状分</div>
  <div class="t-md fi d1">圆的一堆，方的一堆</div>
  <div class="groups fi d2" id="g1"></div>
  <div class="calc fi d3" id="c1"></div>
</div>

<div class="pg" id="p2">
  <div class="badge step fi">第二步 · 每组再按颜色分</div>
  <div class="t-md fi d1">红蓝分开，<span style="color:#e67e22;font-weight:700">2类变4类</span></div>
  <div class="groups fi d2" id="g2" style="flex-wrap:wrap"></div>
  <div class="calc fi d3" id="c2"></div>
</div>

<div class="pg" id="p3">
  <div class="badge step fi">第三步 · 再按扣眼分</div>
  <div class="t-md fi d1">2孔4孔分开，<span style="color:#e67e22;font-weight:700">4类变8类</span></div>
  <div class="groups fi d2" id="g3" style="flex-wrap:wrap;gap:6px"></div>
  <div class="calc fi d3" id="c3"></div>
</div>

<div class="pg" id="p4">
  <div class="badge find fi">发现</div>
  <div class="t-lg fi d1" style="font-size:22px"><span class="warm">每多分一次，类别翻一倍</span></div>
  <div class="calc fi d2" id="c4"></div>
  <div class="t-md fi d3" style="font-size:14px;color:#9b59b6">2类 → 4类 → 8类</div>
</div>

<div class="pg" id="p5">
  <div class="badge find fi">分类树</div>
  <div class="tree-box fi d1" id="tree"></div>
  <div class="t-md fi d2" style="font-size:14px;color:#888">不管先分哪个，最终结果一样</div>
</div>

<div class="pg" id="p6">
  <div class="tip-box fi">
    <div class="tip">分完一次还能继续分<br>每分一次类别翻一倍<br>先分哪个都行，结果一样</div>
  </div>
  <div class="t-md fi d1" style="margin-top:16px;font-size:15px;color:#888">碰到复杂分类题<br>画个分类树就清楚了</div>
</div>

<div class="nw"><div class="nar" id="nar"></div><div class="bt"><div class="bf" id="bar" style="width:0"></div></div></div>
<button class="go" id="go" onclick="doStart()">▶</button>
</div>

<script>
// 8 buttons: shape(circle/square) × color(red/blue) × holes(2/4)
var BTNS=[
  {shape:'circle',color:'red',holes:2},{shape:'circle',color:'red',holes:4},
  {shape:'circle',color:'blue',holes:2},{shape:'circle',color:'blue',holes:4},
  {shape:'square',color:'red',holes:2},{shape:'square',color:'red',holes:4},
  {shape:'square',color:'blue',holes:2},{shape:'square',color:'blue',holes:4}
];

function mkBtn(b,sz,delay){
  var d=document.createElement('div');
  d.className='btn '+b.shape+' '+b.color+' '+(sz||'btn-lg')+' h'+b.holes;
  d.style.animationDelay=(delay*0.08)+'s';
  var hl=document.createElement('div');hl.className='holes';
  for(var i=0;i<b.holes;i++){var h=document.createElement('div');h.className='hole';hl.appendChild(h)}
  d.appendChild(hl);return d;
}

function showAll(id){
  var el=document.getElementById(id);el.innerHTML='';
  for(var i=0;i<BTNS.length;i++) el.appendChild(mkBtn(BTNS[i],'btn-lg',i));
}

function showShapeGroups(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var circles=BTNS.filter(function(b){return b.shape==='circle'});
  var squares=BTNS.filter(function(b){return b.shape==='square'});
  var g1=document.createElement('div');g1.className='group';g1.style.animationDelay='0s';
  var h='<div class="g-title">圆形</div><div class="g-items">';
  circles.forEach(function(b,i){var d=mkBtn(b,'btn-md',i);h+='';});
  // build with DOM
  g1.innerHTML='<div class="g-title">圆形</div>';
  var gi=document.createElement('div');gi.className='g-items';
  circles.forEach(function(b,i){gi.appendChild(mkBtn(b,'btn-md',i))});
  g1.appendChild(gi);
  var gc=document.createElement('div');gc.className='g-count';gc.textContent='4';g1.appendChild(gc);
  el.appendChild(g1);

  var g2=document.createElement('div');g2.className='group';g2.style.animationDelay='.2s';
  g2.innerHTML='<div class="g-title">方形</div>';
  var gi2=document.createElement('div');gi2.className='g-items';
  squares.forEach(function(b,i){gi2.appendChild(mkBtn(b,'btn-md',i))});
  g2.appendChild(gi2);
  var gc2=document.createElement('div');gc2.className='g-count';gc2.textContent='4';g2.appendChild(gc2);
  el.appendChild(g2);

  document.getElementById(cid).innerHTML='<div class="eq">圆 4 + 方 4 = 8 ✅</div>';
}

function showColorGroups(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var combos=[
    {label:'圆红',filter:function(b){return b.shape==='circle'&&b.color==='red'}},
    {label:'圆蓝',filter:function(b){return b.shape==='circle'&&b.color==='blue'}},
    {label:'方红',filter:function(b){return b.shape==='square'&&b.color==='red'}},
    {label:'方蓝',filter:function(b){return b.shape==='square'&&b.color==='blue'}}
  ];
  combos.forEach(function(c,idx){
    var g=document.createElement('div');g.className='group';g.style.animationDelay=(idx*0.15)+'s';g.style.minWidth='70px';
    g.innerHTML='<div class="g-title">'+c.label+'</div>';
    var gi=document.createElement('div');gi.className='g-items';
    BTNS.filter(c.filter).forEach(function(b,i){gi.appendChild(mkBtn(b,'btn-sm',i))});
    g.appendChild(gi);
    var gc=document.createElement('div');gc.className='g-count';gc.textContent='2';g.appendChild(gc);
    el.appendChild(g);
  });
  document.getElementById(cid).innerHTML='<div class="eq">每组 2 个，共 4 组 ✅</div>';
}

function showHoleGroups(gid,cid){
  var el=document.getElementById(gid);el.innerHTML='';
  var labels=['圆红2孔','圆红4孔','圆蓝2孔','圆蓝4孔','方红2孔','方红4孔','方蓝2孔','方蓝4孔'];
  BTNS.forEach(function(b,idx){
    var g=document.createElement('div');g.className='group';g.style.animationDelay=(idx*0.08)+'s';g.style.minWidth='68px';g.style.padding='6px 4px';
    g.innerHTML='<div class="g-title" style="font-size:9px">'+labels[idx]+'</div>';
    var gi=document.createElement('div');gi.className='g-items';
    gi.appendChild(mkBtn(b,'btn-sm',0));
    g.appendChild(gi);
    var gc=document.createElement('div');gc.className='g-count';gc.style.fontSize='16px';gc.textContent='1';g.appendChild(gc);
    el.appendChild(g);
  });
  document.getElementById(cid).innerHTML='<div class="eq">每组 1 个，共 8 组 ✅</div>';
}

function showDiscovery(cid){
  document.getElementById(cid).innerHTML='<div class="eq">第一次分：8 → <span style="color:#3498db">2</span> 类<br>第二次分：2 → <span style="color:#e67e22">4</span> 类<br>第三次分：4 → <span style="color:#9b59b6">8</span> 类</div>';
}

function showTree(id){
  var el=document.getElementById(id);
  el.innerHTML='<div class="tree-title">分类树</div>'+
  '<div style="text-align:center"><span class="tnode root">全部纽扣 8个</span></div>'+
  '<div class="tconn"></div>'+
  '<div class="tlevel">'+
    '<div class="tbranch"><span class="tnode l1">圆形 4</span><div class="tconn"></div>'+
      '<div class="tlevel">'+
        '<div class="tbranch"><span class="tnode leaf" style="background:linear-gradient(135deg,#ff6b6b,#ee5a5a)">红2</span><div class="tconn"></div><div class="tlevel"><span class="tnode leaf" style="font-size:9px">2孔</span><span class="tnode leaf" style="font-size:9px">4孔</span></div></div>'+
        '<div class="tbranch"><span class="tnode leaf" style="background:linear-gradient(135deg,#5b9bd5,#4a8abf)">蓝2</span><div class="tconn"></div><div class="tlevel"><span class="tnode leaf" style="font-size:9px">2孔</span><span class="tnode leaf" style="font-size:9px">4孔</span></div></div>'+
      '</div>'+
    '</div>'+
    '<div class="tbranch"><span class="tnode l1">方形 4</span><div class="tconn"></div>'+
      '<div class="tlevel">'+
        '<div class="tbranch"><span class="tnode leaf" style="background:linear-gradient(135deg,#ff6b6b,#ee5a5a)">红2</span><div class="tconn"></div><div class="tlevel"><span class="tnode leaf" style="font-size:9px">2孔</span><span class="tnode leaf" style="font-size:9px">4孔</span></div></div>'+
        '<div class="tbranch"><span class="tnode leaf" style="background:linear-gradient(135deg,#5b9bd5,#4a8abf)">蓝2</span><div class="tconn"></div><div class="tlevel"><span class="tnode leaf" style="font-size:9px">2孔</span><span class="tnode leaf" style="font-size:9px">4孔</span></div></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

showAll('a0');

var voice=null,playing=false,si=0;
function pickVoice(){var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/Xiaoxiao.*Online.*Natural/i.test(vs[i].name)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/Online.*Natural/i.test(vs[i].name)&&/zh/i.test(vs[i].lang)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/zh/i.test(vs[i].lang)){voice=vs[i];break}}}
if(typeof speechSynthesis!=='undefined'){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(text,cb){var done=false;function finish(){if(!done){done=true;clearTimeout(tmr);setTimeout(cb,600)}}
  var tmr=setTimeout(finish,Math.max(text.length*400,3000));
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='zh-CN';u.rate=0.9;u.pitch=1.05;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch(e){finish()}}
function showPage(id){var ps=document.querySelectorAll('.pg');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');document.getElementById(id).classList.add('on')}

var STEPS=[
  {p:'p0',t:'8个纽扣撒了一地，怎么整理？',fn:function(){showAll('a0')}},
  {p:'p0',t:'有圆有方，有红有蓝，还有不同扣眼。'},
  {p:'p1',t:'第一步，按形状分。',fn:function(){showShapeGroups('g1','c1')}},
  {p:'p1',t:'圆的4个，方的4个，分成了2类。'},
  {p:'p2',t:'每组再按颜色分。',fn:function(){showColorGroups('g2','c2')}},
  {p:'p2',t:'2类变成了4类。'},
  {p:'p3',t:'再按扣眼分，2孔和4孔分开。',fn:function(){showHoleGroups('g3','c3')}},
  {p:'p3',t:'4类变成了8类，每个都不一样。'},
  {p:'p4',t:'发现了吗？每多分一次，类别翻一倍。',fn:function(){showDiscovery('c4')}},
  {p:'p4',t:'从2到4再到8，越分越细。'},
  {p:'p5',t:'画个分类树看得更清楚。',fn:function(){showTree('tree')}},
  {p:'p5',t:'不管先分哪个，最终结果一样。'},
  {p:'p6',t:'分完一次还能继续分。'},
  {p:'p6',t:'碰到复杂分类，画个树就清楚了。'}
];
function runStep(){if(si>=STEPS.length){si=0;playing=false;document.getElementById('go').classList.remove('hide');document.getElementById('go').textContent='↻';return}
  var s=STEPS[si];showPage(s.p);if(s.fn)try{s.fn()}catch(e){}
  document.getElementById('nar').innerHTML=s.t;document.getElementById('bar').style.width=Math.round(((si+1)/STEPS.length)*100)+'%';
  speak(s.t,function(){si++;runStep()})}
function doStart(){if(playing)return;playing=true;si=0;document.getElementById('go').classList.add('hide');runStep()}
</script>
</body></html>
