<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>整理衣柜讲解</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#faf6f1;color:#2d2d2d}.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 120px;opacity:0;pointer-events:none;transition:opacity .6s;overflow-y:auto}.slide.active{opacity:1;pointer-events:auto}.stitle{font-size:clamp(22px,5vw,36px);font-weight:900;text-align:center;margin-bottom:10px;color:#e67e22}.sdesc{font-size:clamp(15px,3vw,20px);color:#666;text-align:center;line-height:1.8;max-width:600px}.hl{color:#e67e22;font-weight:800}.bl{color:#3498db;font-weight:800}.gn{color:#27ae60;font-weight:800}.formula{font-size:clamp(20px,4vw,32px);font-weight:900;text-align:center;margin:12px 0;color:#27ae60}.item-box{width:100%;max-width:420px;min-height:80px;margin:10px auto;padding:16px;border-radius:20px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.it{font-size:2rem;display:inline-flex;flex-direction:column;align-items:center;gap:2px}.it small{font-size:.6rem;color:#999}.it.dim{opacity:.15;transform:scale(.6)}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}.it.bright{animation:bounceIn .4s backwards,floatY 2.5s ease-in-out infinite}.group-box{width:100%;max-width:420px;display:flex;gap:10px;margin:10px auto;justify-content:center}.group{flex:1;padding:12px 8px;border-radius:16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);text-align:center}.group .g-title{font-size:14px;color:#888;margin-bottom:6px;font-weight:700}.group .g-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:40px;font-size:1.5rem}.group .g-count{font-size:22px;font-weight:900;margin-top:6px;color:#27ae60}.compare{width:100%;max-width:420px;margin:10px auto;padding:16px;border-radius:16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);text-align:center}.compare .row{padding:8px 0;font-size:16px;font-weight:700;line-height:1.8}.sum-card{background:#fff;border-radius:16px;padding:14px 18px;margin:6px 0;width:100%;max-width:420px;border-left:4px solid #e67e22;box-shadow:0 2px 12px rgba(0,0,0,.04);opacity:0;transform:translateX(-30px);transition:all .5s}.sum-card.show{opacity:1;transform:translateX(0)}.sum-card h3{color:#e67e22;font-size:16px;margin-bottom:3px}.sum-card p{color:#888;font-size:14px;line-height:1.6}.ctrl{position:fixed;bottom:0;left:0;right:0;height:54px;background:linear-gradient(180deg,rgba(250,246,241,.9),rgba(250,246,241,.98));backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;z-index:100}.ctrl button{background:#fff;border:1px solid rgba(0,0,0,.08);color:#666;border-radius:50px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit}.ctrl .pri{background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;font-weight:700;border:none}.ctrl .pg{color:#bbb;font-size:11px;min-width:44px;text-align:center}.sub{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:14px;padding:10px 22px;max-width:90%;text-align:center;font-size:clamp(14px,2.8vw,17px);color:#444;line-height:1.6;z-index:99;display:none;box-shadow:0 4px 20px rgba(0,0,0,.08)}.sub.vis{display:block}.bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#ff9a76,#27ae60);z-index:101;transition:width .4s}
</style></head><body>
<div class="bar" id="bar"></div>
<div id="slides">
<div class="slide active" id="s0"><div class="stitle" style="font-size:clamp(28px,6vw,44px)">👕 整理衣柜</div><div class="item-box" id="b0"></div><p class="sdesc">妈妈衣柜里有10件衣服<br>可以用不同标准来分！</p></div>
<div class="slide" id="s1"><div class="stitle">10件衣服混在一起</div><div class="item-box" id="b1"></div><p class="sdesc">有上衣有裤子，有长袖有短袖，有夏装有冬装</p></div>
<div class="slide" id="s2"><div class="stitle">第一种分法：上衣 / 下装</div><div class="group-box" id="g2"></div><div class="formula">6 + 4 = 10 ✅</div></div>
<div class="slide" id="s3"><div class="stitle">第二种分法：长袖 / 短袖</div><div class="group-box" id="g3"></div><div class="formula">5 + 5 = 10 ✅</div></div>
<div class="slide" id="s4"><div class="stitle">第三种分法：冬装 / 夏装</div><div class="group-box" id="g4"></div><div class="formula">4 + 6 = 10 ✅</div></div>
<div class="slide" id="s5"><div class="stitle">发现规律</div><div class="compare" id="cmp5"></div><p class="sdesc">分法不同，结果不同，<span class="hl">总数永远是10</span>！</p></div>
<div class="slide" id="s6"><div class="stitle">🌟 重要发现</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:420px"><div class="sum-card" id="sc1"><h3>1️⃣ 同样的东西可以用不同标准分</h3><p>按类型、按长短、按季节……都可以</p></div><div class="sum-card" id="sc2" style="border-left-color:#3498db"><h3 style="color:#3498db">2️⃣ 分法不同 结果不同</h3><p>上衣6+下装4，长袖5+短袖5，冬装4+夏装6</p></div><div class="sum-card" id="sc3" style="border-left-color:#27ae60"><h3 style="color:#27ae60">3️⃣ 总数永远不变</h3><p>不管怎么分，加起来都是10</p></div></div></div>
</div>
<div class="sub" id="subBar"></div>
<div class="ctrl"><button onclick="prev()">⏮</button><button class="pri" id="ttsBtn" onclick="toggleTTS()">🔊 开始讲解</button><button onclick="next()">⏭</button><span class="pg" id="pgInfo">1/7</span><button onclick="goFS()">⛶</button></div>
<script>
var TOTAL=7,cur=0,speaking=false;
var C=[
  {e:'👕',l:'T恤',t:'top',sl:'short',se:'summer'},{e:'👖',l:'长裤',t:'bottom',sl:'long',se:'winter'},
  {e:'🧥',l:'棉袄',t:'top',sl:'long',se:'winter'},{e:'👗',l:'裙子',t:'bottom',sl:'short',se:'summer'},
  {e:'🧣',l:'围巾',t:'top',sl:'long',se:'winter'},{e:'👔',l:'衬衫',t:'top',sl:'long',se:'summer'},
  {e:'🩳',l:'短裤',t:'bottom',sl:'short',se:'summer'},{e:'🧤',l:'手套',t:'top',sl:'long',se:'winter'},
  {e:'👚',l:'背心',t:'top',sl:'short',se:'summer'},{e:'🩱',l:'泳衣',t:'bottom',sl:'short',se:'summer'}
];
function mkIt(c,bright){var d=document.createElement('span');d.className='it'+(bright?' bright':bright===false?' dim':'');d.innerHTML=c.e+'<small>'+c.l+'</small>';return d;}
function fillAll(id){var b=document.getElementById(id);if(!b)return;b.innerHTML='';var s=C.slice().sort(function(){return Math.random()-.5});for(var i=0;i<s.length;i++){var d=mkIt(s[i],true);d.style.animationDelay=(i*.06)+'s';b.appendChild(d);}}
function fillGroup(id,field,aName,bName,aVal,bVal){
  var b=document.getElementById(id);if(!b)return;b.innerHTML='';
  var ga=document.createElement('div');ga.className='group';
  var gb=document.createElement('div');gb.className='group';
  var ha='<div class="g-title">'+aName+'</div><div class="g-items">';
  var hb='<div class="g-title">'+bName+'</div><div class="g-items">';
  var ca=0,cb=0;
  for(var i=0;i<C.length;i++){if(C[i][field]===aVal){ha+=C[i].e;ca++;}else{hb+=C[i].e;cb++;}}
  ha+='</div><div class="g-count">'+ca+'件</div>';hb+='</div><div class="g-count">'+cb+'件</div>';
  ga.innerHTML=ha;gb.innerHTML=hb;b.appendChild(ga);b.appendChild(gb);
}
function fillCmp(){var b=document.getElementById('cmp5');if(!b)return;b.innerHTML='<div class="row" style="color:#e67e22">上衣/下装：6 + 4 = 10</div><div class="row" style="color:#3498db">长袖/短袖：5 + 5 = 10</div><div class="row" style="color:#27ae60">冬装/夏装：4 + 6 = 10</div><div class="row" style="color:#888;font-size:14px;margin-top:6px">分法不同，总数不变！</div>';}
var DF={0:function(){fillAll('b0')},1:function(){fillAll('b1')},2:function(){fillGroup('g2','t','👕 上衣','👖 下装','top','bottom')},3:function(){fillGroup('g3','sl','🧥 长袖/长款','👕 短袖/短款','long','short')},4:function(){fillGroup('g4','se','❄️ 冬装','☀️ 夏装','winter','summer')},5:function(){fillCmp()}};
function showSlide(){var s=document.querySelectorAll('.slide');for(var i=0;i<s.length;i++)s[i].classList.toggle('active',i===cur);document.getElementById('pgInfo').textContent=(cur+1)+'/'+TOTAL;document.getElementById('bar').style.width=((cur+1)/TOTAL*100)+'%';if(DF[cur])try{DF[cur]()}catch(e){}if(cur===6){['sc1','sc2','sc3'].forEach(function(id,i){setTimeout(function(){var el=document.getElementById(id);if(el)el.classList.add('show')},i*300);});}}
function next(){if(cur<TOTAL-1){cur++;showSlide();if(speaking)speakCur();}}
function prev(){if(cur>0){cur--;showSlide();if(speaking)speakCur();}}
var NAR=['小朋友们好！今天帮妈妈整理衣柜。看，衣柜里有好多衣服混在一起！有T恤、长裤、棉袄、裙子、围巾、衬衫、短裤、手套、背心、泳衣，一共10件。怎么整理呢？','先看看这10件衣服。有上衣也有裤子，有长袖也有短袖，有冬天穿的也有夏天穿的。同样的衣服，可以用不同的标准来分！','第一种分法，按类型分！上衣放一边，下装放一边。T恤、棉袄、围巾、衬衫、手套、背心都是上衣，6件。长裤、裙子、短裤、泳衣是下装，4件。6加4等于10！','第二种分法，按长短分！长袖长款的放一边，短袖短款的放一边。长裤、棉袄、围巾、衬衫、手套是长款，5件。T恤、裙子、短裤、背心、泳衣是短款，也是5件。刚好一半一半！','第三种分法，按季节分！冬装放一边，夏装放一边。长裤、棉袄、围巾、手套是冬装，4件。T恤、裙子、衬衫、短裤、背心、泳衣是夏装，6件。4加6等于10！','三种分法对比一下！按类型分是6加4，按长短分是5加5，按季节分是4加6。每次结果都不一样，但加起来都是10！总数永远不变！','重要发现！第一，同样的东西可以用不同标准来分。第二，分法不同结果不同。第三，不管怎么分，总数永远不变。这就是分类最重要的规律！'];
var voice=null;function pickVoice(){var vs=speechSynthesis.getVoices();var names=['Yunxi','Yunyang','Xiaoxiao'];for(var k=0;k<names.length;k++)for(var i=0;i<vs.length;i++)if(vs[i].name.indexOf(names[k])>=0&&vs[i].lang.indexOf('zh')>=0)return vs[i];for(var i=0;i<vs.length;i++)if(vs[i].lang==='zh-CN')return vs[i];return null;}if(window.speechSynthesis){voice=pickVoice();speechSynthesis.onvoiceschanged=function(){voice=pickVoice()};}function speakCur(){speechSynthesis.cancel();var text=NAR[cur];if(!text)return;var utt=new SpeechSynthesisUtterance(text);utt.lang='zh-CN';utt.rate=0.85;utt.pitch=1.0;if(!voice)voice=pickVoice();if(voice)utt.voice=voice;var sub=document.getElementById('subBar');var sents=text.match(/[^。？！；]+[。？！；]?/g)||[text];var si=0;sub.classList.add('vis');sub.textContent=sents[0]||'';utt.onboundary=function(e){if(e.charIndex!==undefined&&sents.length>1){var cc=0;for(var i=0;i<sents.length;i++){cc+=sents[i].length;if(e.charIndex<cc){if(i!==si){si=i;sub.textContent=sents[i].trim();}break;}}}};utt.onend=function(){if(speaking&&cur<TOTAL-1)setTimeout(next,800);else{speaking=false;document.getElementById('ttsBtn').textContent='🔊 开始讲解';sub.classList.remove('vis');}};utt.onerror=function(){if(speaking&&cur<TOTAL-1)setTimeout(next,500);};speechSynthesis.speak(utt);}function toggleTTS(){if(speaking){speaking=false;speechSynthesis.cancel();document.getElementById('ttsBtn').textContent='🔊 开始讲解';document.getElementById('subBar').classList.remove('vis');}else{speaking=true;document.getElementById('ttsBtn').textContent='⏹ 停止';speakCur();}}function goFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen();}var tx=0;document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX});document.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60){d<0?next():prev();}});document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}});showSlide();
</script></body></html>
