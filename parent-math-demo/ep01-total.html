<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分一分 · 二年级数学第一课</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#faf6f1;color:#2d2d2d;font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;justify-content:center;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.s{width:100vw;max-width:430px;height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#faf6f1 0%,#f5efe8 100%)}

/* 暖色装饰 */
.deco{position:absolute;border-radius:50%;opacity:.08}
.deco1{width:260px;height:260px;background:#ff9a76;top:-80px;right:-60px}
.deco2{width:200px;height:200px;background:#ffc97e;bottom:100px;left:-80px}
.deco3{width:150px;height:150px;background:#a8d8ea;top:40%;right:-40px}

/* 页 */
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:50px 28px 150px;opacity:0;pointer-events:none;z-index:2;transition:opacity .7s}
.pg.on{opacity:1;pointer-events:auto}
.pg.on .fi{opacity:1;transform:translateY(0)}
.fi{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.fi.d1{transition-delay:.15s}.fi.d2{transition-delay:.3s}.fi.d3{transition-delay:.45s}

/* 排版 */
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;
  background:#fff3e0;color:#e67e22;border:1px solid #f5d0a0;margin-bottom:12px}
.t-lg{font-size:32px;font-weight:900;text-align:center;line-height:1.4;color:#2d2d2d}
.t-lg .warm{color:#e67e22}.t-lg .calm{color:#3498db}.t-lg .pink{color:#e74c8c}
.t-md{font-size:18px;font-weight:600;text-align:center;line-height:1.6;color:#555}
.t-sm{font-size:13px;color:#999;text-align:center;margin-top:8px}

/* 气球区域 */
.balloon-area{width:320px;height:240px;position:relative;margin:16px 0;
  border-radius:20px;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.05);
  box-shadow:0 4px 20px rgba(0,0,0,.04)}
.balloon{position:absolute;width:44px;height:56px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  transition:all 1s cubic-bezier(.4,0,.2,1)}
.balloon::after{content:'';position:absolute;bottom:-8px;width:1px;height:10px;background:rgba(0,0,0,.15)}
.b-red{background:linear-gradient(135deg,#ffcdd2,#ef9a9a)}
.b-blue{background:linear-gradient(135deg,#bbdefb,#90caf9)}
.b-yellow{background:linear-gradient(135deg,#fff9c4,#fff176)}
.b-flower{border-radius:40%}.b-heart{border-radius:45% 45% 50% 50%}

/* 分组标签 */
.group-labels{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.g-label{padding:8px 16px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;
  background:#fff;border:2px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.04);
  opacity:0;transform:scale(.9);transition:all .4s}
.g-label.show{opacity:1;transform:scale(1)}
.g-label .num{font-size:24px;font-weight:900;display:block}
.g-label .num.warm{color:#e67e22}.g-label .num.calm{color:#3498db}.g-label .num.pink{color:#e74c8c}

/* 提示卡 */
.tip-card{width:100%;max-width:340px;padding:16px 20px;border-radius:16px;
  background:#fff;border:1px solid rgba(0,0,0,.05);box-shadow:0 4px 16px rgba(0,0,0,.05);
  margin-top:12px;opacity:0;transition:opacity .5s}
.tip-card.show{opacity:1}
.tip-card .icon{font-size:24px;margin-bottom:6px}
.tip-card .tip-text{font-size:14px;color:#555;line-height:1.8}
.tip-card .tip-text b{color:#e67e22}

/* 底部 */
.nar-w{position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:14px 24px 30px;background:linear-gradient(transparent,rgba(250,246,241,.97) 30%)}
.nar{text-align:center;font-size:16px;line-height:1.8;color:#444;font-weight:500;min-height:36px}
.nar .hl{color:#e67e22;font-weight:700}
.bar-t{height:3px;border-radius:2px;background:rgba(0,0,0,.06);margin-top:8px}
.bar-f{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9a76,#e67e22);transition:width .5s}
.tag{position:absolute;top:16px;left:20px;font-size:10px;color:#bbb;letter-spacing:2px;font-weight:600;z-index:10}
.go{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:20;
  padding:12px 44px;border:none;border-radius:26px;font-size:16px;font-weight:700;
  background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;cursor:pointer;
  box-shadow:0 4px 20px rgba(230,126,34,.2)}
.go.hide{display:none}
</style></head><body>
<div class="s">
  <div class="deco deco1"></div><div class="deco deco2"></div><div class="deco deco3"></div>
  <div class="tag">二年级 · 分类与整理 · 第1课</div>

  <div class="pg on" id="p0">
    <div class="badge fi">课本知识点</div>
    <div class="t-lg fi d1">孩子不会整理东西？<br><span class="warm">给一个标准就行</span></div>
    <div class="t-sm fi d2">二年级数学 · 分类与整理 · 第一课</div>
  </div>
  <div class="pg" id="p1">
    <div class="t-md fi">课本上有一堆气球<br>形状不同，颜色不同</div>
    <div class="balloon-area fi d1" id="area1"></div>
    <div class="t-sm fi d2">怎么整理？</div>
  </div>
  <div class="pg" id="p2">
    <div class="t-md fi">第一种：<span style="color:#e67e22;font-weight:700">按形状分</span></div>
    <div class="balloon-area fi d1" id="area2"></div>
    <div class="group-labels fi d2" id="gl1"></div>
  </div>
  <div class="pg" id="p3">
    <div class="t-md fi">换一种：<span style="color:#3498db;font-weight:700">按颜色分</span></div>
    <div class="balloon-area fi d1" id="area3"></div>
    <div class="group-labels fi d2" id="gl2"></div>
  </div>
  <div class="pg" id="p4">
    <div class="t-lg fi">同样的气球<br><span class="warm">换种分法</span><br><span class="calm">结果不同</span></div>
    <div class="t-md fi d1" style="margin-top:12px">按形状：3、4、5，有多有少<br>按颜色：4、4、4，一样多</div>
  </div>
  <div class="pg" id="p5">
    <div class="t-md fi">课本上还教了三种<span style="color:#e67e22">记录方法</span></div>
    <div class="group-labels fi d1" id="methods"></div>
    <div class="t-sm fi d2">第三种最方便 —— 以后常用</div>
  </div>
  <div class="pg" id="p6">
    <div class="badge fi">💡 家长怎么用</div>
    <div class="t-lg fi d1"><span class="warm">别说"快收拾"</span></div>
    <div class="tip-card fi d2" id="tip"></div>
  </div>

  <div class="nar-w"><div class="nar" id="nar">点击按钮，开始自动讲解</div>
    <div class="bar-t"><div class="bar-f" id="bar" style="width:0"></div></div></div>
  <button class="go" id="go" onclick="start()">▶ 开始讲解</button>
</div>
<script>
const BALLOONS=[
  {e:'🌸',shape:'flower',color:'red',cls:'b-red b-flower'},
  {e:'💗',shape:'heart',color:'red',cls:'b-red b-heart'},
  {e:'🎈',shape:'circle',color:'red',cls:'b-red'},
  {e:'❤️',shape:'heart',color:'red',cls:'b-red b-heart'},
  {e:'💙',shape:'heart',color:'blue',cls:'b-blue b-heart'},
  {e:'🔵',shape:'circle',color:'blue',cls:'b-blue'},
  {e:'💠',shape:'flower',color:'blue',cls:'b-blue b-flower'},
  {e:'🟡',shape:'circle',color:'yellow',cls:'b-yellow'},
  {e:'🌼',shape:'flower',color:'yellow',cls:'b-yellow b-flower'},
  {e:'🟡',shape:'circle',color:'yellow',cls:'b-yellow'},
  {e:'🔵',shape:'circle',color:'blue',cls:'b-blue'},
  {e:'💛',shape:'heart',color:'yellow',cls:'b-yellow b-heart'},
];
function fillArea(id,positions){
  const a=document.getElementById(id);a.innerHTML='';
  BALLOONS.forEach((b,i)=>{const d=document.createElement('div');
    d.className='balloon '+b.cls;d.textContent=b.e;
    d.style.left=positions[i][0]+'px';d.style.top=positions[i][1]+'px';
    a.appendChild(d)});
}
function scatter(id){
  const pos=BALLOONS.map((_,i)=>[15+(i%4)*72, 15+Math.floor(i/4)*72]);
  fillArea(id,pos);
}
function sortByShape(id){
  const gs={flower:[],heart:[],circle:[]};
  BALLOONS.forEach((b,i)=>gs[b.shape].push(i));
  const pos=Array(12);
  const cx={flower:20,heart:115,circle:210};
  Object.entries(cx).forEach(([s,x])=>gs[s].forEach((idx,j)=>{pos[idx]=[x,15+j*55]}));
  fillArea(id,pos);
  setTimeout(()=>{
    const gl=document.getElementById('gl1');gl.innerHTML='';
    [['3','🌸 花形','warm'],['4','💗 心形','pink'],['5','🎈 圆形','calm']].forEach(([n,l,c])=>{
      const d=document.createElement('div');d.className='g-label';
      d.innerHTML=`<span class="num ${c}">${n}</span>${l}`;gl.appendChild(d);
      setTimeout(()=>d.classList.add('show'),200)});
  },600);
}
function sortByColor(id){
  const gs={red:[],blue:[],yellow:[]};
  BALLOONS.forEach((b,i)=>gs[b.color].push(i));
  const pos=Array(12);
  const cx={red:20,blue:115,yellow:210};
  Object.entries(cx).forEach(([c,x])=>gs[c].forEach((idx,j)=>{pos[idx]=[x,15+j*55]}));
  fillArea(id,pos);
  setTimeout(()=>{
    const gl=document.getElementById('gl2');gl.innerHTML='';
    [['4','🔴 红色','warm'],['4','🔵 蓝色','calm'],['4','🟡 黄色','warm']].forEach(([n,l,c])=>{
      const d=document.createElement('div');d.className='g-label';
      d.innerHTML=`<span class="num ${c}">${n}</span>${l}`;gl.appendChild(d);
      setTimeout(()=>d.classList.add('show'),200)});
  },600);
}
function showMethods(){
  const ml=document.getElementById('methods');ml.innerHTML='';
  [['1️⃣','先分再数','分成堆，数每堆'],['2️⃣','边数边画','画圈圈记'],['3️⃣ ⭐','图标+数字','又快又清楚']].forEach(([i,t,d])=>{
    const el=document.createElement('div');el.className='g-label';
    el.innerHTML=`<span style="font-size:20px">${i}</span><b>${t}</b><br><span style="font-size:11px;color:#999">${d}</span>`;
    ml.appendChild(el);setTimeout(()=>el.classList.add('show'),200)});
}
function showTip(){
  const t=document.getElementById('tip');
  t.innerHTML=`<div class="icon">🗣</div><div class="tip-text">
  孩子东西乱的时候——<br>
  ❌ 别说<b>「快收拾」</b><br>
  ✅ 说<b>「先按一个标准分」</b><br><br>
  按颜色、按大小、按用途都行<br>
  <b>给一个标准，比催他快有用</b></div>`;
  t.classList.add('show');
}

let voice=null,playing=false,si=0;
function pv(){const v=speechSynthesis.getVoices();
  voice=v.find(x=>/Xiaoxiao.*Online.*Natural/i.test(x.name))
  ||v.find(x=>/Online.*Natural/i.test(x.name)&&/zh/i.test(x.lang))
  ||v.find(x=>/zh/i.test(x.lang))||v[0]}
speechSynthesis.onvoiceschanged=pv;pv();
function say(t,cb){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.voice=voice;u.lang='zh-CN';u.rate=.9;u.pitch=1.05;
  u.onend=()=>setTimeout(cb,600);u.onerror=()=>setTimeout(cb,600);speechSynthesis.speak(u)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.getElementById(id).classList.add('on')}

const S=[
  {p:'p0',t:'孩子不会整理东西？给一个标准就行。'},
  {p:'p1',t:'课本上有一堆气球，形状不同，颜色也不同。',fn:()=>scatter('area1')},
  {p:'p1',t:'怎么把它们整理清楚呢？'},
  {p:'p2',t:'第一种方法，按形状分。',fn:()=>sortByShape('area2')},
  {p:'p2',t:'花形三个，心形四个，圆形五个。'},
  {p:'p3',t:'换一种，按颜色分。',fn:()=>sortByColor('area3')},
  {p:'p3',t:'红四个，蓝四个，黄四个，一样多！'},
  {p:'p4',t:'同样的气球，换种分法，结果完全不同。'},
  {p:'p5',t:'课本还教了三种记录方法。',fn:showMethods},
  {p:'p5',t:'第三种图标加数字，又快又清楚。'},
  {p:'p6',t:'家长怎么用这个知识？',fn:showTip},
  {p:'p6',t:'给一个标准，比催他快点有用。'},
];
function run(){if(si>=S.length){si=0;playing=false;document.getElementById('go').classList.remove('hide');
  document.getElementById('go').textContent='▶ 重新播放';return}
  const s=S[si];show(s.p);if(s.fn)setTimeout(s.fn,300);
  document.getElementById('nar').innerHTML=s.t;
  document.getElementById('bar').style.width=Math.round(((si+1)/S.length)*100)+'%';
  say(s.t,()=>{si++;run()})}
function start(){if(playing)return;playing=true;si=0;document.getElementById('go').classList.add('hide');run()}
</script></body></html>
