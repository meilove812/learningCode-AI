<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分类题解题思路</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#faf6f1;color:#2d2d2d;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;justify-content:center;height:100vh;overflow:hidden}
.s{width:100vw;max-width:430px;height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#faf6f1,#f5efe8)}
.deco{position:absolute;border-radius:50%;opacity:.05}
.dc1{width:280px;height:280px;background:#ff9a76;top:-80px;right:-80px}
.dc2{width:200px;height:200px;background:#a8d8ea;bottom:80px;left:-60px}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px 150px;opacity:0;pointer-events:none;z-index:2;transition:opacity .7s}
.pg.on{opacity:1;pointer-events:auto}
.pg.on .fi{opacity:1;transform:translateY(0)}
.fi{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.fi.d1{transition-delay:.15s}.fi.d2{transition-delay:.3s}.fi.d3{transition-delay:.45s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px}
.badge.tip{background:#fff8ee;color:#e67e22;border:1px solid #f5d0a0}
.badge.err{background:#fff0f0;color:#e74c3c;border:1px solid #f5c6c6}
.badge.ok{background:#f0fff4;color:#27ae60;border:1px solid #a3d9b1}
.t-lg{font-size:30px;font-weight:900;text-align:center;line-height:1.4}
.t-lg .warm{color:#e67e22}.t-lg .red{color:#e74c3c}.t-lg .grn{color:#27ae60}
.t-md{font-size:18px;font-weight:600;text-align:center;line-height:1.7;color:#444}
.t-sm{font-size:13px;color:#aaa;text-align:center;margin-top:6px}
.items-area{width:330px;min-height:200px;position:relative;margin:14px 0;padding:16px;border-radius:20px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.item{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:all .6s}
.item.circle{border-radius:50%}
.item.c-red{background:linear-gradient(135deg,#ff6b6b,#ee5a5a)}
.item.c-blue{background:linear-gradient(135deg,#74b9ff,#5a9bdb)}
.item.c-green{background:linear-gradient(135deg,#55efc4,#3dc9a0)}
.item.dup{animation:shake .3s ease-in-out infinite;box-shadow:0 0 0 3px #e74c3c,0 4px 16px rgba(231,76,60,.3)}
.item.dup::after{content:'重复';position:absolute;top:-10px;right:-10px;padding:2px 6px;border-radius:8px;font-size:9px;font-weight:700;background:#e74c3c;color:#fff;animation:popIn .3s}
.groups{width:330px;display:flex;gap:8px;margin:10px 0}
.group{flex:1;padding:10px 6px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.03);text-align:center}
.group .g-title{font-size:12px;color:#888;margin-bottom:6px;font-weight:600}
.group .g-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:40px}
.group .g-item{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.group .g-count{font-size:20px;font-weight:900;margin-top:6px}
.group .g-count.red{color:#e74c3c}.group .g-count.grn{color:#27ae60}
.calc{width:330px;padding:16px 20px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 3px 12px rgba(0,0,0,.04);margin:10px 0;text-align:center}
.calc .eq{font-size:22px;font-weight:900;line-height:2}
.calc .eq .red{color:#e74c3c}.calc .eq .grn{color:#27ae60}
.tip-box{width:330px;padding:18px;border-radius:16px;text-align:center;background:linear-gradient(135deg,#fff8ee,#fff3e0);border:2px solid #f5d0a0;margin:10px 0}
.tip-box .tip{font-size:18px;font-weight:900;color:#e67e22;line-height:1.7}
.nw{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:14px 24px 30px;background:linear-gradient(transparent,rgba(250,246,241,.97) 30%)}
.nar{text-align:center;font-size:16px;line-height:1.8;color:#444;font-weight:500;min-height:36px}
.bt{height:3px;border-radius:2px;background:rgba(0,0,0,.05);margin-top:8px}
.bf{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9a76,#e67e22);transition:width .5s}
.tag{position:absolute;top:16px;left:20px;font-size:10px;color:#ccc;letter-spacing:2px;font-weight:600;z-index:10}
.go{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:20;padding:12px 44px;border:none;border-radius:26px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(230,126,34,.2)}
.go.hide{display:none}
</style></head><body>
<div class="s">
<div class="deco dc1"></div><div class="deco dc2"></div>
<div class="tag">分类题 · 解题思路</div>

<div class="pg on" id="p0">
  <div class="badge tip fi">分类题</div>
  <div class="t-lg fi d1"><span class="warm">按什么分 → 分一分 → 数一数</span></div>
  <div class="t-md fi d2" style="margin-top:12px">掌握这个思路<br>所有分类题都能解</div>
</div>

<div class="pg" id="p1">
  <div class="t-md fi">比如这12个物品混在一起</div>
  <div class="items-area fi d1" id="a1"></div>
  <div class="t-md fi d2" style="font-size:15px;color:#888">怎么分？第一步：选一个标准</div>
</div>

<div class="pg" id="p2">
  <div class="badge tip fi">第一步：按什么分</div>
  <div class="t-md fi d1">按<span style="color:#e67e22;font-weight:700">颜色</span>分成三组</div>
  <div class="groups fi d2" id="g1"></div>
  <div class="calc fi d3" id="c1"></div>
</div>

<div class="pg" id="p3">
  <div class="badge err fi">⚠️ 常见错误</div>
  <div class="t-md fi d1">有两个被<span style="color:#e74c3c;font-weight:700">数了两遍</span></div>
  <div class="items-area fi d2" id="a2"></div>
  <div class="t-sm fi d3">交界处的物品容易重复计数</div>
</div>

<div class="pg" id="p4">
  <div class="badge ok fi">✅ 第二步：数一数</div>
  <div class="t-md fi d1">每组数完<span style="color:#27ae60;font-weight:700">加一加</span>，对总数</div>
  <div class="groups fi d2" id="g2"></div>
  <div class="calc fi d3" id="c2"></div>
</div>

<div class="pg" id="p5">
  <div class="tip-box fi">
    <div class="tip">按什么分 → 分一分 → 数一数<br>加一加对总数<br>对上了就没重没漏</div>
  </div>
  <div class="t-md fi d1" style="margin-top:16px;font-size:15px;color:#888">掌握思路比做对一道题重要<br>所有分类题都是同一个方法</div>
</div>

<div class="nw"><div class="nar" id="nar">点击按钮，开始讲解</div><div class="bt"><div class="bf" id="bar" style="width:0"></div></div></div>
<button class="go" id="go" onclick="doStart()">▶ 开始讲解</button>
</div>

<script>
var ITEMS=[
  {s:'circle',c:'c-red',l:'红'},{s:'',c:'c-red',l:'红'},{s:'circle',c:'c-red',l:'红'},{s:'',c:'c-red',l:'红'},
  {s:'circle',c:'c-blue',l:'蓝'},{s:'',c:'c-blue',l:'蓝'},{s:'circle',c:'c-blue',l:'蓝'},{s:'',c:'c-blue',l:'蓝'},
  {s:'circle',c:'c-green',l:'绿'},{s:'',c:'c-green',l:'绿'},{s:'circle',c:'c-green',l:'绿'},{s:'',c:'c-green',l:'绿'}
];

function showItems(id,dupIdx){
  var el=document.getElementById(id);el.innerHTML='';
  for(var i=0;i<ITEMS.length;i++){
    var d=document.createElement('div');
    d.className='item '+(ITEMS[i].s?ITEMS[i].s:'')+' '+ITEMS[i].c;
    d.textContent=ITEMS[i].l;
    if(dupIdx&&dupIdx.indexOf(i)>=0)(function(dd){setTimeout(function(){dd.classList.add('dup')},400)})(d);
    el.appendChild(d);
  }
}

function showGroups(id,calcId,wrong){
  var el=document.getElementById(id);el.innerHTML='';
  var colors=[{name:'红色',cls:'c-red',count:wrong?5:4},{name:'蓝色',cls:'c-blue',count:wrong?5:4},{name:'绿色',cls:'c-green',count:4}];
  for(var i=0;i<colors.length;i++){
    var g=document.createElement('div');g.className='group';
    var html='<div class="g-title">'+colors[i].name+'</div><div class="g-items">';
    for(var j=0;j<colors[i].count;j++)html+='<div class="g-item '+colors[i].cls+'">'+colors[i].name[0]+'</div>';
    html+='</div><div class="g-count '+(wrong&&colors[i].count!==4?'red':'grn')+'">'+colors[i].count+'</div>';
    g.innerHTML=html;el.appendChild(g);
  }
  var ce=document.getElementById(calcId);
  if(wrong)ce.innerHTML='<div class="eq"><span class="red">5</span> + <span class="red">5</span> + 4 = <span class="red">14</span> ≠ 12 ❌</div>';
  else ce.innerHTML='<div class="eq"><span class="grn">4</span> + <span class="grn">4</span> + <span class="grn">4</span> = <span class="grn">12</span> = 12 ✅</div>';
}

var voice=null,playing=false,si=0;
function pickVoice(){
  var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/Xiaoxiao.*Online.*Natural/i.test(vs[i].name)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/Online.*Natural/i.test(vs[i].name)&&/zh/i.test(vs[i].lang)){voice=vs[i];break}}
  if(!voice)for(var i=0;i<vs.length;i++){if(/zh/i.test(vs[i].lang)){voice=vs[i];break}}
}
if(typeof speechSynthesis!=='undefined'){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}

function speak(text,cb){
  var done=false;
  function finish(){if(!done){done=true;clearTimeout(tmr);setTimeout(cb,600)}}
  var tmr=setTimeout(finish,Math.max(text.length*400,3000));
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);
    if(voice)u.voice=voice;u.lang='zh-CN';u.rate=0.9;u.pitch=1.05;
    u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch(e){finish()}
}
function showPage(id){var ps=document.querySelectorAll('.pg');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');document.getElementById(id).classList.add('on')}

var STEPS=[
  {p:'p0',t:'分类题，掌握一个思路就够了。'},
  {p:'p0',t:'按什么分，分一分，数一数。'},
  {p:'p1',t:'比如这十二个物品混在一起。',fn:function(){showItems('a1')}},
  {p:'p1',t:'第一步，想好按什么来分。'},
  {p:'p2',t:'按颜色分成三组，每组数一数。',fn:function(){showGroups('g1','c1',true)}},
  {p:'p2',t:'五加五加四等于十四，多了两个。'},
  {p:'p3',t:'问题在这里，两个物品数了两遍。',fn:function(){showItems('a2',[4,8])}},
  {p:'p3',t:'交界处的最容易重复。'},
  {p:'p4',t:'正确做法，每组数完加一加对总数。',fn:function(){showGroups('g2','c2',false)}},
  {p:'p4',t:'四加四加四等于十二，对上了。'},
  {p:'p5',t:'按什么分，分一分，数一数，加一加对总数。'},
  {p:'p5',t:'掌握思路比做对一道题重要，所有分类题都是同一个方法。'},
];

function runStep(){
  if(si>=STEPS.length){si=0;playing=false;document.getElementById('go').classList.remove('hide');document.getElementById('go').textContent='▶ 重新播放';return}
  var s=STEPS[si];showPage(s.p);
  if(s.fn)try{s.fn()}catch(e){}
  document.getElementById('nar').innerHTML=s.t;
  document.getElementById('bar').style.width=Math.round(((si+1)/STEPS.length)*100)+'%';
  speak(s.t,function(){si++;runStep()});
}
function doStart(){if(playing)return;playing=true;si=0;document.getElementById('go').classList.add('hide');runStep()}
</script>
</body></html>
