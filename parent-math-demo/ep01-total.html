<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>总数不变 · 二年级数学</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0a0e27;color:#e8ecf8;font-family:-apple-system,'Microsoft YaHei',sans-serif;
  display:flex;justify-content:center;overflow:hidden}
.stage{width:390px;height:844px;position:relative;overflow:hidden}
.header{text-align:center;padding:18px 16px 6px}
.header h1{font-size:20px;font-weight:800;line-height:1.4}
.header .sub{font-size:12px;color:#8a95b8;margin-top:4px}
.arena{position:relative;width:360px;height:380px;margin:8px auto;border-radius:16px;
  background:rgba(255,255,255,.03)}
.narration{position:absolute;bottom:80px;left:16px;right:16px;min-height:80px;
  padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.6);
  backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);
  font-size:15px;line-height:1.7;color:#f0f0f0;text-align:center}
.narration .highlight{color:#ffd700;font-weight:700}
.progress{position:absolute;bottom:60px;left:16px;right:16px;height:4px;
  border-radius:2px;background:rgba(255,255,255,.1)}
.progress-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#ffd700,#ff9500);
  transition:width .4s}
.start-btn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  padding:10px 40px;border:none;border-radius:24px;
  background:linear-gradient(135deg,#ffd700,#ff9500);color:#0a0e27;
  font-size:15px;font-weight:700;cursor:pointer}
.labels{display:flex;justify-content:space-around;margin:0 8px;gap:6px}
.lbl{flex:1;text-align:center;padding:8px 4px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  opacity:0;transition:opacity .6s}
.lbl.show{opacity:1}
.lbl b{display:block;font-size:22px;color:#ffd700}
.lbl span{font-size:11px;color:#b9c2dd}
.ball{position:absolute;width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  transition:all 1s cubic-bezier(.4,0,.2,1)}
.tip{position:absolute;bottom:160px;left:16px;right:16px;
  padding:10px 14px;border-radius:10px;text-align:center;
  font-size:13px;color:#8ef6c8;font-weight:700;
  background:rgba(142,246,200,.08);border:1px solid rgba(142,246,200,.2);
  opacity:0;transition:opacity .6s}
.tip.show{opacity:1}

.total-box{text-align:center;margin:8px 0}
.total-num{font-size:48px;font-weight:900;color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,.3);
  transition:transform .4s}
.total-num.pulse{animation:pulse .5s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.total-label{font-size:12px;color:#8ef6c8}
.groups{display:flex;gap:10px;margin:0 12px;height:340px}
.group{flex:1;background:rgba(255,255,255,.03);border-radius:14px;padding:10px 6px;
  border:1px solid rgba(255,255,255,.08);text-align:center}
.group-title{font-size:13px;font-weight:700;min-height:22px;margin-bottom:6px}
.people{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.person{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .8s cubic-bezier(.4,0,.2,1);
  box-shadow:0 3px 10px rgba(0,0,0,.3)}
.person.adult{background:rgba(109,158,232,.2)}
.person.child{background:rgba(255,179,122,.2)}
.person.male{background:rgba(142,246,200,.2)}
.person.female{background:rgba(255,158,196,.2)}
.group-count{font-size:24px;font-weight:900;color:#ffd700;margin-top:6px}
.eq{text-align:center;font-size:15px;color:#8ef6c8;margin:6px;font-weight:700;
  opacity:0;transition:opacity .6s}
.eq.show{opacity:1}
</style></head><body>
<div class="stage">
  <div class="header"><h1>🎮 换一种分法，总数变不变？</h1><div class="sub">二年级 · 分类与整理 · 第2课</div></div>
  <div class="total-box"><div class="total-num" id="total">14</div><div class="total-label">👆 盯住这个数</div></div>
  <div class="groups" id="groups">
    <div class="group"><div class="group-title" id="gt1"></div><div class="people" id="p1"></div><div class="group-count" id="c1"></div></div>
    <div class="group"><div class="group-title" id="gt2"></div><div class="people" id="p2"></div><div class="group-count" id="c2"></div></div>
  </div>
  <div class="eq" id="eq"></div>
  <div class="tip" id="tip"></div>
  <div class="narration">点击下方按钮，开始自动讲解</div>
  <div class="progress"><div class="progress-bar" style="width:0"></div></div>
  <button class="start-btn" onclick="start()">▶ 开始讲解</button>
</div>
<script>

let voice=null,playing=false,stepIdx=0;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/Xiaoxiao.*Online.*Natural/i.test(v.name))
    ||vs.find(v=>/Online.*Natural/i.test(v.name)&&/zh/i.test(v.lang))
    ||vs.find(v=>/zh/i.test(v.lang))||vs[0];
  if(voice)console.log('Voice:',voice.name);
}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
function speak(text,cb){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.voice=voice;u.lang='zh-CN';u.rate=0.92;u.pitch=1.05;
  u.onend=()=>{setTimeout(cb,600)};
  u.onerror=()=>{setTimeout(cb,600)};
  speechSynthesis.speak(u);
}
function updateProgress(){
  const pct=Math.round((stepIdx/STEPS.length)*100);
  document.querySelector('.progress-bar').style.width=pct+'%';
}
function runStep(){
  if(stepIdx>=STEPS.length){
    document.querySelector('.narration').innerHTML='<span class="highlight">演示结束</span><br>点击重新播放';
    document.querySelector('.start-btn').textContent='▶ 重新播放';
    document.querySelector('.start-btn').style.display='block';
    playing=false;stepIdx=0;return;
  }
  const s=STEPS[stepIdx];
  document.querySelector('.narration').innerHTML=s.html||s.text;
  updateProgress();
  if(s.fn)s.fn();
  speak(s.text,()=>{stepIdx++;runStep()});
}
function start(){
  if(playing)return;playing=true;stepIdx=0;
  document.querySelector('.start-btn').style.display='none';
  runStep();
}

const PP=[
  {e:'👨',age:'adult',gender:'male'},{e:'👩',age:'adult',gender:'female'},
  {e:'👨',age:'adult',gender:'male'},{e:'👩',age:'adult',gender:'female'},
  {e:'👨',age:'adult',gender:'male'},{e:'👩',age:'adult',gender:'female'},
  {e:'👨',age:'adult',gender:'male'},{e:'👩',age:'adult',gender:'female'},
  {e:'👦',age:'child',gender:'male'},{e:'👧',age:'child',gender:'female'},
  {e:'👦',age:'child',gender:'male'},{e:'👧',age:'child',gender:'female'},
  {e:'👦',age:'child',gender:'male'},{e:'👧',age:'child',gender:'female'},
];
function mp(p,cls){const d=document.createElement('div');d.className='person '+cls;d.textContent=p.e;return d}
function showAll(){
  ['p1','p2'].forEach(id=>document.getElementById(id).innerHTML='');
  ['gt1','gt2','c1','c2'].forEach(id=>document.getElementById(id).textContent='');
  document.getElementById('eq').classList.remove('show');
  document.getElementById('tip').classList.remove('show');
  PP.forEach(p=>document.getElementById('p1').appendChild(mp(p,'')));
}
function splitAge(){
  ['p1','p2'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('gt1').textContent='🧑 大人';document.getElementById('gt2').textContent='👶 小孩';
  PP.filter(p=>p.age==='adult').forEach(p=>document.getElementById('p1').appendChild(mp(p,'adult')));
  PP.filter(p=>p.age==='child').forEach(p=>document.getElementById('p2').appendChild(mp(p,'child')));
  document.getElementById('c1').textContent='8';document.getElementById('c2').textContent='6';
  document.getElementById('eq').classList.remove('show');
  const t=document.getElementById('total');t.classList.add('pulse');setTimeout(()=>t.classList.remove('pulse'),600);
}
function splitGender(){
  ['p1','p2'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('gt1').textContent='👦 男生';document.getElementById('gt2').textContent='👧 女生';
  PP.filter(p=>p.gender==='male').forEach(p=>document.getElementById('p1').appendChild(mp(p,'male')));
  PP.filter(p=>p.gender==='female').forEach(p=>document.getElementById('p2').appendChild(mp(p,'female')));
  document.getElementById('c1').textContent='7';document.getElementById('c2').textContent='7';
  document.getElementById('eq').classList.remove('show');
  const t=document.getElementById('total');t.classList.add('pulse');setTimeout(()=>t.classList.remove('pulse'),600);
}
function showEq(t){const el=document.getElementById('eq');el.textContent=t;el.classList.add('show')}
function showTip(t){const el=document.getElementById('tip');el.textContent=t;el.classList.add('show')}
const STEPS=[
  {text:'十四个人站在操场上，要分两组。',fn:showAll},
  {text:'先按年龄分：大人站左边，小孩站右边。',fn:splitAge},
  {text:'大人八个，小孩六个。',html:'大人<span class="highlight">8</span>个，小孩<span class="highlight">6</span>个。'},
  {text:'八加六等于十四。总数没变。',fn:()=>showEq('8 + 6 = 14 ✅')},
  {text:'现在换一种，按男女分。',fn:splitGender},
  {text:'男生七个，女生七个。',html:'男生<span class="highlight">7</span>个，女生<span class="highlight">7</span>个。'},
  {text:'七加七还是十四。总数还是没变！',fn:()=>showEq('7 + 7 = 14 ✅')},
  {text:'不管怎么分，总数永远不变。',html:'不管怎么分，<span class="highlight">总数永远不变</span>。'},
  {text:'家长怎么用这个知识？',fn:()=>showTip('💡 让孩子分完后加一加，验证总数')},
  {text:'孩子分完之后，让他加一加。',html:'孩子分完之后，让他<span class="highlight">加一加</span>。'},
  {text:'加起来和原来一样，就对了。',html:'加起来和原来一样，就<span class="highlight">对了</span>。'},
  {text:'加起来不对，说明漏了或者重复了。',html:'不对？说明<span class="highlight">漏了或重复了</span>。'},
];
</script></body></html>
