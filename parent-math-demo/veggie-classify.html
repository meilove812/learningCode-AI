<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>蔬菜分类讲解</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#faf6f1;color:#2d2d2d}.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 120px;opacity:0;pointer-events:none;transition:opacity .6s;overflow-y:auto}.slide.active{opacity:1;pointer-events:auto}.stitle{font-size:clamp(22px,5vw,36px);font-weight:900;text-align:center;margin-bottom:10px;color:#e67e22}.sdesc{font-size:clamp(15px,3vw,20px);color:#666;text-align:center;line-height:1.8;max-width:600px}.hl{color:#e67e22;font-weight:800}.bl{color:#3498db;font-weight:800}.gn{color:#27ae60;font-weight:800}.formula{font-size:clamp(20px,4vw,32px);font-weight:900;text-align:center;margin:12px 0;color:#27ae60}.item-box{width:100%;max-width:420px;min-height:80px;margin:10px auto;padding:16px;border-radius:20px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}.it{font-size:2rem;display:inline-block}.it.dim{opacity:.15;transform:scale(.6)}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}.it.bright{animation:bounceIn .4s backwards,floatY 2.5s ease-in-out infinite}.group-box{width:100%;max-width:420px;display:flex;flex-wrap:wrap;gap:8px;margin:10px auto;justify-content:center}.group{flex:1;min-width:90px;padding:10px 6px;border-radius:16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);text-align:center}.group .g-title{font-size:13px;color:#888;margin-bottom:4px;font-weight:700}.group .g-items{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:30px;font-size:1.5rem}.group .g-count{font-size:20px;font-weight:900;margin-top:4px;color:#27ae60}.group.most{border:2px solid #e67e22}.group.least{border:2px solid #3498db}.compare{width:100%;max-width:420px;margin:10px auto;padding:16px;border-radius:16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);text-align:center}.compare .row{padding:6px 0;font-size:16px;font-weight:700;line-height:1.8}.sum-card{background:#fff;border-radius:16px;padding:14px 18px;margin:6px 0;width:100%;max-width:420px;border-left:4px solid #e67e22;box-shadow:0 2px 12px rgba(0,0,0,.04);opacity:0;transform:translateX(-30px);transition:all .5s}.sum-card.show{opacity:1;transform:translateX(0)}.sum-card h3{color:#e67e22;font-size:16px;margin-bottom:3px}.sum-card p{color:#888;font-size:14px;line-height:1.6}.ctrl{position:fixed;bottom:0;left:0;right:0;height:54px;background:linear-gradient(180deg,rgba(250,246,241,.9),rgba(250,246,241,.98));backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;z-index:100}.ctrl button{background:#fff;border:1px solid rgba(0,0,0,.08);color:#666;border-radius:50px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit}.ctrl .pri{background:linear-gradient(135deg,#ff9a76,#e67e22);color:#fff;font-weight:700;border:none}.ctrl .pg{color:#bbb;font-size:11px;min-width:44px;text-align:center}.sub{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:14px;padding:10px 22px;max-width:90%;text-align:center;font-size:clamp(14px,2.8vw,17px);color:#444;line-height:1.6;z-index:99;display:none;box-shadow:0 4px 20px rgba(0,0,0,.08)}.sub.vis{display:block}.bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#ff9a76,#27ae60);z-index:101;transition:width .4s}
</style></head><body>
<div class="bar" id="bar"></div>
<div id="slides">
<div class="slide active" id="s0"><div class="stitle" style="font-size:clamp(28px,6vw,44px)">🥬 蔬菜分类</div><div class="item-box" id="b0"></div><p class="sdesc">16个蔬菜混在一起<br>按种类分一分、数一数、比一比</p></div>
<div class="slide" id="s1"><div class="stitle">一共16个蔬菜</div><div class="item-box" id="b1"></div><p class="sdesc">6种不同的蔬菜，每种有几个呢？</p></div>
<div class="slide" id="s2"><div class="stitle">按种类分一分</div><div class="item-box" id="b2"></div><p class="sdesc">🥕胡萝卜 🍅小番茄 🫑青椒 🧅洋葱 🥒黄瓜 🌶️辣椒<br>同一种放在一起！</p></div>
<div class="slide" id="s3"><div class="stitle">分好了！数一数</div><div class="group-box" id="g3"></div></div>
<div class="slide" id="s4"><div class="stitle">比一比 谁最多谁最少</div><div class="group-box" id="g4"></div><p class="sdesc">🍅小番茄 <span class="hl">最多</span>（5个）· 🧅洋葱 <span class="bl">最少</span>（1个）</p></div>
<div class="slide" id="s5"><div class="stitle">加一加 对总数！</div><div class="compare" id="cmp5"></div><div class="formula">3+5+2+1+2+3 = 16 ✅</div></div>
<div class="slide" id="s6"><div class="stitle">🌟 分类三步法</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:420px"><div class="sum-card" id="sc1"><h3>1️⃣ 分一分</h3><p>同一种蔬菜放在一起</p></div><div class="sum-card" id="sc2" style="border-left-color:#3498db"><h3 style="color:#3498db">2️⃣ 数一数</h3><p>每组有几个，数清楚</p></div><div class="sum-card" id="sc3" style="border-left-color:#27ae60"><h3 style="color:#27ae60">3️⃣ 比一比</h3><p>哪种最多、最少？加起来对总数</p></div></div></div>
</div>
<div class="sub" id="subBar"></div>
<div class="ctrl"><button onclick="prev()">⏮</button><button class="pri" id="ttsBtn" onclick="toggleTTS()">🔊 开始讲解</button><button onclick="next()">⏭</button><span class="pg" id="pgInfo">1/7</span><button onclick="goFS()">⛶</button></div>
<script>
var TOTAL=7,cur=0,speaking=false;
var V=[{e:'🥕',t:'carrot'},{e:'🥕',t:'carrot'},{e:'🥕',t:'carrot'},{e:'🍅',t:'tomato'},{e:'🍅',t:'tomato'},{e:'🍅',t:'tomato'},{e:'🍅',t:'tomato'},{e:'🍅',t:'tomato'},{e:'🫑',t:'pepper'},{e:'🫑',t:'pepper'},{e:'🧅',t:'onion'},{e:'🥒',t:'cucumber'},{e:'🥒',t:'cucumber'},{e:'🌶️',t:'chili'},{e:'🌶️',t:'chili'},{e:'🌶️',t:'chili'}];
var G=[{t:'carrot',n:'🥕胡萝卜',c:3},{t:'tomato',n:'🍅小番茄',c:5,most:1},{t:'pepper',n:'🫑青椒',c:2},{t:'onion',n:'🧅洋葱',c:1,least:1},{t:'cucumber',n:'🥒黄瓜',c:2},{t:'chili',n:'🌶️辣椒',c:3}];
function fillAll(id){var b=document.getElementById(id);if(!b)return;b.innerHTML='';var s=V.slice().sort(function(){return Math.random()-.5});for(var i=0;i<s.length;i++){var d=document.createElement('span');d.className='it bright';d.textContent=s[i].e;d.style.animationDelay=(i*.05)+'s';b.appendChild(d);}}
function fillGroups(id,mark){var b=document.getElementById(id);if(!b)return;b.innerHTML='';for(var g=0;g<G.length;g++){var d=document.createElement('div');d.className='group'+(mark&&G[g].most?' most':'')+(mark&&G[g].least?' least':'');var h='<div class="g-title">'+G[g].n+'</div><div class="g-items">';for(var i=0;i<V.length;i++)if(V[i].t===G[g].t)h+=V[i].e;h+='</div><div class="g-count">'+G[g].c+'个</div>';d.innerHTML=h;b.appendChild(d);}}
function fillCmp(id){var b=document.getElementById(id);if(!b)return;b.innerHTML='<div class="row" style="font-size:14px;color:#888">🥕3 + 🍅5 + 🫑2 + 🧅1 + 🥒2 + 🌶️3</div><div class="row" style="color:#27ae60">= 16 ✅ 没重没漏！</div>';}
var DF={0:function(){fillAll('b0')},1:function(){fillAll('b1')},2:function(){fillAll('b2')},3:function(){fillGroups('g3',0)},4:function(){fillGroups('g4',1)},5:function(){fillCmp('cmp5')}};
function showSlide(){var s=document.querySelectorAll('.slide');for(var i=0;i<s.length;i++)s[i].classList.toggle('active',i===cur);document.getElementById('pgInfo').textContent=(cur+1)+'/'+TOTAL;document.getElementById('bar').style.width=((cur+1)/TOTAL*100)+'%';if(DF[cur])try{DF[cur]()}catch(e){}if(cur===6){['sc1','sc2','sc3'].forEach(function(id,i){setTimeout(function(){var el=document.getElementById(id);if(el)el.classList.add('show')},i*300);});}}
function next(){if(cur<TOTAL-1){cur++;showSlide();if(speaking)speakCur();}}
function prev(){if(cur>0){cur--;showSlide();if(speaking)speakCur();}}
var NAR=['小朋友们好！今天来分蔬菜。看，桌上有好多蔬菜混在一起，有胡萝卜、小番茄、青椒、洋葱、黄瓜、辣椒。一共有多少个呢？','数一数，一共16个蔬菜，有6种不同的。这么多混在一起，看不清每种有几个。怎么办呢？','按种类来分！同一种蔬菜放在一起。胡萝卜放一组，小番茄放一组，青椒、洋葱、黄瓜、辣椒各放一组。','分好了！数一数每组有几个。胡萝卜3个，小番茄5个，青椒2个，洋葱1个，黄瓜2个，辣椒3个。','比一比！小番茄最多，有5个，用橙色框标出来了。洋葱最少，只有1个，用蓝色框标出来了。胡萝卜和辣椒都是3个，青椒和黄瓜都是2个。','加起来验证！3加5加2加1加2加3，等于16。跟总数一样！没有数重也没有漏掉。','总结三步法！分一分，同一种放在一起。数一数，每组有几个。比一比，谁最多谁最少，加起来对总数。'];
var voice=null;function pickVoice(){var vs=speechSynthesis.getVoices();var names=['Yunxi','Yunyang','Xiaoxiao'];for(var k=0;k<names.length;k++)for(var i=0;i<vs.length;i++)if(vs[i].name.indexOf(names[k])>=0&&vs[i].lang.indexOf('zh')>=0)return vs[i];for(var i=0;i<vs.length;i++)if(vs[i].lang==='zh-CN')return vs[i];return null;}if(window.speechSynthesis){voice=pickVoice();speechSynthesis.onvoiceschanged=function(){voice=pickVoice()};}function speakCur(){speechSynthesis.cancel();var text=NAR[cur];if(!text)return;var utt=new SpeechSynthesisUtterance(text);utt.lang='zh-CN';utt.rate=0.85;utt.pitch=1.0;if(!voice)voice=pickVoice();if(voice)utt.voice=voice;var sub=document.getElementById('subBar');var sents=text.match(/[^。？！；]+[。？！；]?/g)||[text];var si=0;sub.classList.add('vis');sub.textContent=sents[0]||'';utt.onboundary=function(e){if(e.charIndex!==undefined&&sents.length>1){var cc=0;for(var i=0;i<sents.length;i++){cc+=sents[i].length;if(e.charIndex<cc){if(i!==si){si=i;sub.textContent=sents[i].trim();}break;}}}};utt.onend=function(){if(speaking&&cur<TOTAL-1)setTimeout(next,800);else{speaking=false;document.getElementById('ttsBtn').textContent='🔊 开始讲解';sub.classList.remove('vis');}};utt.onerror=function(){if(speaking&&cur<TOTAL-1)setTimeout(next,500);};speechSynthesis.speak(utt);}function toggleTTS(){if(speaking){speaking=false;speechSynthesis.cancel();document.getElementById('ttsBtn').textContent='🔊 开始讲解';document.getElementById('subBar').classList.remove('vis');}else{speaking=true;document.getElementById('ttsBtn').textContent='⏹ 停止';speakCur();}}function goFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen();}var tx=0;document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX});document.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60){d<0?next():prev();}});document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}});showSlide();
</script></body></html>
